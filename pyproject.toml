[project]
name = "smartmatch-platform"
version = "0.1.0"
description = "SmartMatch platform monorepo — Foundation scaffold (architecture v1.1)"
requires-python = ">=3.11,<3.13"
readme = "README.md"

[tool.uv.workspace]
members = [
    "python/smartmatch_domain",
    "python/smartmatch_authz",
    "python/smartmatch_providers",
    "python/smartmatch_persistence",
    "services/api",
    "services/worker",
]

[tool.uv.sources]
smartmatch-domain = { workspace = true }
smartmatch-authz = { workspace = true }
smartmatch-providers = { workspace = true }
smartmatch-persistence = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "import-linter>=2.1",
    "httpx>=0.27.0",
]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["clients/typescript", "db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

# En dash, em dash, and the section sign are intentional in prose: numeric and
# release ranges (0–100, R1–R4) and architecture citations (v1.1 §1.3). Degrading
# them to ASCII would make the documentation worse, not safer.
allowed-confusables = ["–", "—", "§", "×"]

# ---------------------------------------------------------------------------
# Typing
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
mypy_path = [
    "python/smartmatch_domain",
    "python/smartmatch_authz",
    "python/smartmatch_providers",
    "python/smartmatch_persistence",
    "services/api",
    "services/worker",
]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# OR-Tools ships partial type information; its generated protobuf modules are
# not typed. Narrow to the one package rather than relaxing strict mode.
#
# `follow_imports = "skip"` is required, not optional — verified with a
# minimal, fresh-cache reproduction outside this codebase before relying on
# it. OR-Tools ships no `py.typed` marker, so without this line mypy still
# finds and partially type-checks its actual (untyped) .py source rather than
# treating the package as opaque, and that partial checking is wrong for how
# this module calls it: `CpModel.NewBoolVar`/`.Add`/`.Maximize` — the
# CamelCase convenience API this module uses (matching the ratified model
# spec) — are added to the class dynamically at runtime (see
# `deprecated_method`/`snake_case_to_camel_case` in
# ortools/sat/python/cp_model.py), not declared statically, so mypy reports
# them as undefined attributes; `ortools.__version__`, real at runtime, is
# also lost once `cp_model` is imported alongside it. `ignore_missing_imports`
# alone does not fix either — it only suppresses "stub not found" errors, and
# ortools's source *is* found. `follow_imports = "skip"` instead stops mypy
# from analyzing ortools' internals at all, treating the package as Any at
# its import boundary — a stricter containment of ortools than
# `ignore_missing_imports` alone, not a relaxation of strict mode anywhere
# else in this project.
[[tool.mypy.overrides]]
module = ["ortools.*"]
ignore_missing_imports = true
follow_imports = "skip"

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    # The repository root, so tests can import the single-file tools/ scripts.
    ".",
    "python/smartmatch_domain",
    "python/smartmatch_authz",
    "python/smartmatch_providers",
    "python/smartmatch_persistence",
    "services/api",
    "services/worker",
]
addopts = "-q --strict-markers"
markers = [
    "golden: characterization tests pinning ported legacy behavior",
    "integration: requires a live PostgreSQL instance",
    # tests/e2e — HTTP against a running `docker compose` appliance. Excluded
    # from `make test` and `make test-all` by marker rather than by path, so a
    # file added under tests/e2e cannot accidentally put a suite that needs a
    # whole stack into the no-database gate. `make e2e` is what runs it.
    "e2e: requires a running docker compose appliance (see `make e2e`)",
]

# ---------------------------------------------------------------------------
# Architecture boundaries (import-linter)
# ---------------------------------------------------------------------------
# Enforced in CI by `lint-imports`. The domain package is the innermost layer
# and must not reach frameworks, storage, providers, the filesystem, or the
# network. See docs/architecture/decisions/ADR-0002-package-boundaries.md.

[tool.importlinter]
root_packages = [
    "smartmatch_domain",
    "smartmatch_authz",
    "smartmatch_providers",
    "smartmatch_persistence",
    # Added by CE-ROUTERS so ADR-0025 D2's boundary can be expressed at all:
    # the rule is about a *router*, and a contract cannot name a module in a
    # package the graph does not contain. No layers contract names it, so the
    # API package is unconstrained here except by the exercise contract below —
    # this widens what can be said, not what is forbidden.
    "smartmatch_api",
]
# Required so the forbidden contracts below can name third-party and stdlib
# modules. Without it, "domain must not import FastAPI" cannot be expressed.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is pure — no frameworks, storage, providers, IO, or env"
type = "forbidden"
source_modules = ["smartmatch_domain"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "alembic",
    "pydantic_settings",
    "httpx",
    "requests",
    "google",
    "boto3",
    "os",
    "pathlib",
    "socket",
    "subprocess",
    "smartmatch_providers",
    # Added by CE-HARDENING. The API package entered the graph with CE-ROUTERS,
    # and until now "the domain does not import the web service" was true only
    # because nobody had written the line. The layers contract below cannot say
    # it — `smartmatch_api` is deliberately not one of its layers — so it is said
    # here, in the three packages that must never depend on the service that
    # composes them.
    "smartmatch_api",
]

[[tool.importlinter.contracts]]
name = "Authz is pure — policy only, no frameworks or storage"
type = "forbidden"
source_modules = ["smartmatch_authz"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "httpx",
    "requests",
    "os",
    "subprocess",
    "smartmatch_providers",
    # CE-HARDENING, for the reason given on the domain contract above.
    "smartmatch_api",
]

[[tool.importlinter.contracts]]
name = "Layering: outer packages may use domain types, never the reverse"
type = "layers"
layers = [
    "smartmatch_persistence",
    "smartmatch_providers",
    "smartmatch_authz",
    "smartmatch_domain",
]

# Persistence is allowed SQLAlchemy — it is the storage layer — but it must not
# reach the network, spawn processes, or call providers. Storage that quietly
# makes an HTTP call is the coupling this contract exists to prevent.
# ADR-0025 D2. The class exercise keeps its own tables, with no tenant_id, no
# owning_unit_id and no foreign key to user_account — "a team is not a tenant
# and a made-up profile is not an account". The ADR states the boundary as an
# import rule as well as a schema one: the exercise code may not import
# smartmatch_authz or any tenant-scoped repository.
#
# This contract is the first half. smartmatch_authz is named here because it is
# the package whose absence makes the rule true: exercise code that could ask a
# policy question would have something to ask it about, and the answer would be
# a tenant. The second half — the repositories — is an allow-list in
# tests/unit/test_exercise_schema.py rather than a denial list here, so a
# repository added later is refused without anyone remembering to extend a list
# of names.
#
# The exercise routers (services/api/smartmatch_api/routers/exercise_*) are not
# named: they do not exist yet, and import-linter refuses a contract naming a
# module it cannot import. Adding them is part of the CE-ROUTERS card.
[[tool.importlinter.contracts]]
name = "Class exercise persistence carries no tenancy — ADR-0025 D2"
type = "forbidden"
source_modules = ["smartmatch_persistence.exercise"]
forbidden_modules = [
    "smartmatch_authz",
    "smartmatch_providers",
    "fastapi",
    "starlette",
    "httpx",
    "requests",
    "subprocess",
]

[[tool.importlinter.contracts]]
name = "Persistence is storage only — no network, providers, or frameworks"
type = "forbidden"
source_modules = ["smartmatch_persistence"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "httpx",
    "requests",
    "subprocess",
    "smartmatch_providers",
    # CE-HARDENING, for the reason given on the domain contract above.
    "smartmatch_api",
]

# ADR-0025 D2, as a rule rather than a habit. The class exercise is a no-login
# product over made-up rows: its routers must not be able to resolve a
# principal or reach a tenant-scoped repository, so that "unauthenticated" is a
# property of the module rather than a promise in its docstring.
#
# Every exercise router is listed by name, and a later one must add itself here.
# A pattern was tried first and import-linter rejects it: a wildcard may only
# replace a *whole* module name ("A wildcard can only replace a whole module"),
# so `smartmatch_api.routers.exercise_*` is not expressible, and the shapes that
# are — `smartmatch_api.routers.*`, or moving these into an
# `smartmatch_api.routers.exercise` subpackage — each cost more than they save.
# The first would put every CBA router under a rule written for the exercise;
# the second would hide these modules from the route ledger in
# `tests/authz/test_policy_matrix.py`, which globs `routers/*.py` and is what
# forces every unauthenticated route to be declared with a reason. So: one line
# per router, and CE-INSTRUCTOR, CE-WORKSPACE, CE-SIMULATION and CE-INGEST each
# add theirs with the module.
#
# `smartmatch_persistence.exercise` gets its own contract from CE-SCHEMA, which
# owns those modules; this one is about the API surface.
# CE-WORKSPACE, design decision 1. `smartmatch_persistence` stays forbidden and
# the exercise still needs its own tables, so the door is a single ignored edge
# rather than a hole in the wall.
#
# The shape that was tried first and rejected: allow an exercise router to import
# `smartmatch_persistence.exercise` directly. Import-linter cannot express
# "forbidden except this subpackage" — `forbidden_modules` covers descendants and
# there is no allow-list — so it would have to be written as one `ignore_imports`
# line per router per repository, and each of those lines blinds the contract to
# everything *that* router reaches through *that* repository.
#
# What is built instead: routers import `smartmatch_api.exercise_dependencies`
# and nothing else, that module imports the exercise repositories, and the one
# edge below is ignored. It is narrow in all three coordinates — one source
# module (the door), one destination subpackage (`.exercise`), and nothing else
# on the forbidden list is relaxed. A router that imports any repository
# directly still fails. A router that reaches `smartmatch_authz`,
# `smartmatch_api.dependencies`, or a tenant-scoped repository through the door
# still fails, because the ignore names only `smartmatch_persistence.exercise`
# and the contract keeps its chain-following behaviour for everything else.
#
# Verified by a negative probe rather than by reading: adding
# `from smartmatch_persistence.pilot_auth import PilotSessionRepository` to
# `routers/exercise_workspace.py` fails this contract; so does adding it to
# `exercise_dependencies.py`. Both were run and reverted; the output is in the
# PR body.
#
# What this ignore cannot see, and who does: that a module under
# `smartmatch_persistence.exercise` touches only `exercise_`-prefixed tables.
# That half is `tests/unit/test_exercise_persistence_tables.py`, which walks
# every module in the package and refuses a table name without the prefix.
[[tool.importlinter.contracts]]
name = "Class exercise routers carry no principal or tenancy"
type = "forbidden"
source_modules = [
    "smartmatch_api.routers.exercise_public",
    "smartmatch_api.routers.exercise_workspace",
]
forbidden_modules = [
    "smartmatch_authz",
    "smartmatch_persistence",
    "smartmatch_api.dependencies",
    "smartmatch_api.units",
    "smartmatch_api.job_authz",
    "smartmatch_api.routers.auth",
]
ignore_imports = [
    "smartmatch_api.exercise_dependencies -> smartmatch_persistence.exercise.workspace_repository",
]

# SQLAlchemy is deliberately *not* on the list above, and this is why it gets a
# contract of its own instead.
#
# The exercise's later tracks need to read and write the `exercise_` tables, and
# ADR-0025 D2 permits exactly that. `smartmatch_api.exercise_dependencies` is
# the one sanctioned door (`get_exercise_session` / `ExerciseSession`), and it
# necessarily imports SQLAlchemy to hand back a `Session`. Adding "sqlalchemy"
# to the contract above — which forbids *indirect* imports, as a forbidden
# contract does by default — would therefore ban the door along with the wall,
# the moment a router walked through it.
#
# So the rule is stated as what it actually is: an exercise router does not
# touch SQLAlchemy *itself*. It takes `ExerciseSession`, which carries the type
# for it, and never writes a query, a `select()`, or a `sessionmaker` of its
# own. `allow_indirect_imports` narrows this contract to direct imports, which
# is the whole of its claim; it does not weaken the contract above, which keeps
# its default chain-following behaviour for authz, persistence, and the CBA
# request machinery.
[[tool.importlinter.contracts]]
name = "Class exercise routers do not touch SQLAlchemy directly"
type = "forbidden"
source_modules = [
    "smartmatch_api.routers.exercise_public",
    "smartmatch_api.routers.exercise_workspace",
]
forbidden_modules = ["sqlalchemy"]
allow_indirect_imports = true
