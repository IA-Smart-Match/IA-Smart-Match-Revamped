[project]
name = "smartmatch-platform"
version = "0.1.0"
description = "SmartMatch platform monorepo — Foundation scaffold (architecture v1.1)"
requires-python = ">=3.11,<3.13"
readme = "README.md"

[tool.uv.workspace]
members = [
    "python/smartmatch_domain",
    "python/smartmatch_authz",
    "python/smartmatch_providers",
    "python/smartmatch_persistence",
    "services/api",
    "services/worker",
]

[tool.uv.sources]
smartmatch-domain = { workspace = true }
smartmatch-authz = { workspace = true }
smartmatch-providers = { workspace = true }
smartmatch-persistence = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "import-linter>=2.1",
    "httpx>=0.27.0",
]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["clients/typescript", "db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

# En dash, em dash, and the section sign are intentional in prose: numeric and
# release ranges (0–100, R1–R4) and architecture citations (v1.1 §1.3). Degrading
# them to ASCII would make the documentation worse, not safer.
allowed-confusables = ["–", "—", "§", "×"]

# ---------------------------------------------------------------------------
# Typing
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
mypy_path = [
    "python/smartmatch_domain",
    "python/smartmatch_authz",
    "python/smartmatch_providers",
    "python/smartmatch_persistence",
    "services/api",
    "services/worker",
]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# OR-Tools ships partial type information; its generated protobuf modules are
# not typed. Narrow to the one package rather than relaxing strict mode.
#
# `follow_imports = "skip"` is required, not optional — verified with a
# minimal, fresh-cache reproduction outside this codebase before relying on
# it. OR-Tools ships no `py.typed` marker, so without this line mypy still
# finds and partially type-checks its actual (untyped) .py source rather than
# treating the package as opaque, and that partial checking is wrong for how
# this module calls it: `CpModel.NewBoolVar`/`.Add`/`.Maximize` — the
# CamelCase convenience API this module uses (matching the ratified model
# spec) — are added to the class dynamically at runtime (see
# `deprecated_method`/`snake_case_to_camel_case` in
# ortools/sat/python/cp_model.py), not declared statically, so mypy reports
# them as undefined attributes; `ortools.__version__`, real at runtime, is
# also lost once `cp_model` is imported alongside it. `ignore_missing_imports`
# alone does not fix either — it only suppresses "stub not found" errors, and
# ortools's source *is* found. `follow_imports = "skip"` instead stops mypy
# from analyzing ortools' internals at all, treating the package as Any at
# its import boundary — a stricter containment of ortools than
# `ignore_missing_imports` alone, not a relaxation of strict mode anywhere
# else in this project.
[[tool.mypy.overrides]]
module = ["ortools.*"]
ignore_missing_imports = true
follow_imports = "skip"

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    # The repository root, so tests can import the single-file tools/ scripts.
    ".",
    "python/smartmatch_domain",
    "python/smartmatch_authz",
    "python/smartmatch_providers",
    "python/smartmatch_persistence",
    "services/api",
    "services/worker",
]
addopts = "-q --strict-markers"
markers = [
    "golden: characterization tests pinning ported legacy behavior",
    "integration: requires a live PostgreSQL instance",
]

# ---------------------------------------------------------------------------
# Architecture boundaries (import-linter)
# ---------------------------------------------------------------------------
# Enforced in CI by `lint-imports`. The domain package is the innermost layer
# and must not reach frameworks, storage, providers, the filesystem, or the
# network. See docs/architecture/decisions/ADR-0002-package-boundaries.md.

[tool.importlinter]
root_packages = [
    "smartmatch_domain",
    "smartmatch_authz",
    "smartmatch_providers",
    "smartmatch_persistence",
]
# Required so the forbidden contracts below can name third-party and stdlib
# modules. Without it, "domain must not import FastAPI" cannot be expressed.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is pure — no frameworks, storage, providers, IO, or env"
type = "forbidden"
source_modules = ["smartmatch_domain"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "alembic",
    "pydantic_settings",
    "httpx",
    "requests",
    "google",
    "boto3",
    "os",
    "pathlib",
    "socket",
    "subprocess",
    "smartmatch_providers",
]

[[tool.importlinter.contracts]]
name = "Authz is pure — policy only, no frameworks or storage"
type = "forbidden"
source_modules = ["smartmatch_authz"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "httpx",
    "requests",
    "os",
    "subprocess",
    "smartmatch_providers",
]

[[tool.importlinter.contracts]]
name = "Layering: outer packages may use domain types, never the reverse"
type = "layers"
layers = [
    "smartmatch_persistence",
    "smartmatch_providers",
    "smartmatch_authz",
    "smartmatch_domain",
]

# Persistence is allowed SQLAlchemy — it is the storage layer — but it must not
# reach the network, spawn processes, or call providers. Storage that quietly
# makes an HTTP call is the coupling this contract exists to prevent.
[[tool.importlinter.contracts]]
name = "Persistence is storage only — no network, providers, or frameworks"
type = "forbidden"
source_modules = ["smartmatch_persistence"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "httpx",
    "requests",
    "subprocess",
    "smartmatch_providers",
]
