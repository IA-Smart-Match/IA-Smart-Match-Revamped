# Compose override for the synthetic pilot VM.
#
#   docker compose -f docker-compose.yml -f docker-compose.vm.yml up -d
#
# This file is what makes the appliance survive a reboot on the VM. It changes
# three things and nothing else:
#
#   1. Long-running services get `restart: unless-stopped`, so Docker brings
#      them back after a reboot or a crash. The one-shot services (migrate,
#      seed, seed-principals, seed-logins, seed-review) keep `restart: "no"`
#      from the base file:
#      a seed that re-ran on every boot would either fail on its own conflict
#      guard or quietly re-seed a database an operator has been working in.
#   2. `SMARTMATCH_RELEASE` is taken from the environment, so the API's
#      /api/health reports the git SHA that is actually deployed. That is what
#      makes "did the deployment land" answerable from outside the VM, and it
#      is the value scripts/compose_health.sh compares against.
#   3. Nothing else. In particular the published ports are NOT changed, because
#      the base file already binds every one of them to 127.0.0.1 — the
#      database, the API, and the worker are reachable only from the VM itself,
#      and the single externally reachable surface is the Cloudflare Tunnel
#      pointed at 127.0.0.1:5173. An override that published 0.0.0.0 here would
#      undo that in one line, which is why this file states it rather than
#      leaving it to be inferred.
#
# ---------------------------------------------------------------------------
# What this does NOT make the VM
# ---------------------------------------------------------------------------
# The instance stays synthetic: SMARTMATCH_EDITION=dev, fixture providers,
# seeded data, the compose-only bearer tokens — four of them since the pilot
# needs one principal per portal, all still refused under any edition but dev —
# and the legacy frontend. It has
# no identity provider, no real user, no live provider credential, and no
# production data. ALLOW_CLOUD_DEPLOY=false still holds — see
# docs/operations/vm-deploy.md for the gates that must close before any of this
# becomes a production deployment, and docs/operations/deploy-runbook.md's
# "Not yet applicable" table for what is still absent.

services:
  db:
    restart: unless-stopped

  api:
    restart: unless-stopped
    environment:
      # The deployed git SHA, written by scripts/vm/deploy.sh. The default
      # keeps a hand-run `docker compose up` on the VM honest rather than
      # letting it claim a release it does not have.
      SMARTMATCH_RELEASE: ${SMARTMATCH_RELEASE:-vm-unknown}
      # No fixture bearer token authenticates anything on this machine.
      #
      # docker-compose.yml says of its dev principals that they "authenticate
      # nothing outside this compose network". That is true of a laptop. It is
      # false here, and dangerously so: a Cloudflare Tunnel publishes this
      # compose network to the public internet, and this repository is PUBLIC,
      # so the token literals in the base file are world-readable — as was the
      # copy the browser bundle carried. Anyone who could read the file could
      # present one of those tokens and be answered as the seeded coordinator,
      # student, host or admin, without ever seeing /login.
      #
      # An EMPTY MAP, not an empty string. `dev_principals` is typed
      # `dict[str, str]` with `default_factory=dict` (services/api/
      # smartmatch_api/config.py), so pydantic-settings JSON-decodes this value:
      # "{}" parses to an empty dict, while "" would raise inside json.loads and
      # crash the API at startup — which the deployment health gate would answer
      # by rolling back to the very release this override exists to retire.
      #
      # Settings._validate_isolation is guarded by `if self.dev_principals:`, so
      # an empty map skips that validator entirely and boots under any edition.
      # FixtureTokenVerifier.verify then finds nothing for any token and raises,
      # which dependencies.py renders as a clean 401 `unauthenticated`.
      #
      # Password login is untouched: dependencies.py resolves a real DB-backed
      # session token BEFORE it ever consults the fixture verifier.
      #
      # Local `docker compose up` (base file only) is deliberately unchanged —
      # the fixture identities remain exactly as they were for development.
      SMARTMATCH_DEV_PRINCIPALS: "{}"

  worker:
    restart: unless-stopped
    environment:
      SMARTMATCH_RELEASE: ${SMARTMATCH_RELEASE:-vm-unknown}

  scheduler:
    restart: unless-stopped
    # This sidecar answers nothing over HTTP (see docker-compose.yml's
    # scheduler comment) but shares Dockerfile.worker, which bakes in a
    # HEALTHCHECK against /health. That check can never pass here, so
    # disable it rather than have docker ps permanently flag a working
    # process as unhealthy.
    healthcheck:
      disable: true

  web:
    restart: unless-stopped
    environment:
      # The bundle this VM serves carries no credential of its own.
      #
      # The base file bakes the `compose-api` fixture token in here, which made
      # the shipped JavaScript itself a copy of a coordinator credential: read
      # the bundle, read the token. Emptying it is the other half of the api
      # override above — clearing the server's map stops the token being
      # accepted, and clearing this stops it being handed out.
      #
      # An empty STRING is correct here, unlike SMARTMATCH_DEV_PRINCIPALS above.
      # This one is a plain string, and apps/web/legacy-frontend/src/lib/
      # bearerToken.ts already treats a blank value as absent: resolveBearerToken
      # returns `usableCredential(sessionToken) ?? usableCredential(envToken)`,
      # and usableCredential() maps a whitespace-only string to null. So the app
      # simply sends no Authorization header until someone actually signs in.
      # No frontend source change is needed, and none was made.
      #
      # The visible consequence is intended: a visitor to the public hostname is
      # now anonymous until they log in at /login. That is the point — the pilot
      # keeps frictionless click-through to the sign-in page, not past it.
      VITE_SMARTMATCH_BEARER_TOKEN: ""
