# Secret-scanning configuration.
#
# The full default rule set is kept — nothing is disabled, and no file and no
# rule is exempted. The single allowlist below exempts one literal string.

[extend]
useDefault = true

[[allowlists]]
description = """
tests/unit/test_forbidden_scanner.py asserts that the forbidden-behavior
scanner's `hard-coded-credential` rule fires on both the bare form
(api_key = "...") and the quoted form ("api_key": "..."). The quoted form is how
credentials most often actually get committed, and that gap was found by this
very self-test — so the assertion has to carry a literal shaped like a
credential.

`re_abcdefghijklmnop123456` is that literal: the alphabet from a to p followed
by 123456. No provider issued it, it authenticates nothing, and it exists only
so a gate that catches real credentials can be proven to work.

Scoped to the exact string rather than to the file or the rule, deliberately.
The file is still scanned for every other secret shape, and
`generic-api-key` still fires everywhere else in the tree and its history.
"""
regexTarget = "match"
regexes = ['''re_abcdefghijklmnop123456''']

[[allowlists]]
description = """
`docs/plans/perf-baseline-828.md` records the P4 performance baseline. To be
reproducible it has to show the exact command the measurement was taken with,
which means showing the dev principal the request authenticated as — once in
`SMARTMATCH_DEV_PRINCIPALS` and once in the `Authorization: Bearer` header of
the `curl` line. Two default rules fire on that pair: `generic-api-key` on the
JSON form and `curl-auth-header` on the header form.

`p4-perf-token` is that principal. It is a key in the `SMARTMATCH_DEV_PRINCIPALS`
fixture map, honored only when `SMARTMATCH_EDITION=dev` and
`SMARTMATCH_USE_FIXTURE_PROVIDERS=true`, against a loopback server. No provider
issued it, it authenticates nothing outside that dev fixture path, and a
benchmark whose command cannot be re-run is not a baseline.

Scoped to the exact string, matching the allowlist above: the file is still
scanned for every other secret shape, and both rules still fire everywhere else
in the tree and its history.
"""
regexTarget = "match"
regexes = ['''p4-perf-token''']

[[allowlists]]
description = """
`INSTALL.md` and the compose smoke job in `.github/workflows/build.yml` document
and exercise the full import -> review -> metrics loop against the local
appliance. To be runnable both have to show the `Authorization: Bearer` header
the loopback request actually carries, which makes `curl-auth-header` fire.

`compose-api` is that header value. It is a key in the dev principal map pinned
in `docker-compose.yml`
(`{"compose-api":"compose-pilot-coordinator"}`), honored only by the compose
appliance's dev edition against 127.0.0.1. No provider issued it and it
authenticates nothing outside that stack; a quick start whose curl lines cannot
be pasted is not a quick start.

Scoped to the exact string, matching the allowlists above: both files are still
scanned for every other secret shape, and `curl-auth-header` still fires
everywhere else in the tree and its history.
"""
regexTarget = "match"
regexes = ['''compose-api''']

[[allowlists]]
description = """
`tests/unit/test_spend_sweeper.py` builds a fake reservation row to prove
`_snapshot_from_row` maps every column the domain type declares. One of those
columns is `work_key` — the idempotency key a spend reservation is claimed
under — so the fixture has to carry a literal one, and `generic-api-key` fires
on its shape.

`spend-abc123` is that literal. It is a test-local identifier for a row that
never leaves the test process: it names a unit of work, it is not a credential,
and nothing authenticates with it.

Scoped to the exact string, matching the allowlists above: the file is still
scanned for every other secret shape, and `generic-api-key` still fires
everywhere else in the tree and its history.
"""
regexTarget = "match"
regexes = ['''spend-abc123''']

[[allowlists]]
description = """
`tests/unit/test_vm_deploy_script.py` asserts that `scripts/vm/deploy.sh`
redacts credential-shaped text before it reaches a deployment log — a log that
a GitHub Actions job then prints in full. Proving a redaction filter works
requires feeding it something the filter must actually catch, so the test's
stub `docker` prints this literal in two shapes the filter targets
(`Authorization: Bearer <value>` and `SOME_TOKEN=<value>`) and the test asserts
neither survives into the log.

`abcdefgh12345678ABCDEFGH` is that literal: a to h, 1 to 8, then A to H. No
provider issued it, it authenticates nothing, it never leaves the test process,
and it exists only so a gate that keeps real credentials out of deployment logs
can be proven to work rather than assumed to.

A shorter or lower-entropy placeholder would not do: the redaction filter only
fires on runs of eight or more credential characters, so a value gitleaks
ignored would also be a value the filter ignored, and the test would pass
without testing anything.

Scoped to the exact string, matching the allowlists above: the file is still
scanned for every other secret shape, and `generic-api-key` still fires
everywhere else in the tree and its history.
"""
regexTarget = "match"
regexes = ['''abcdefgh12345678ABCDEFGH''']
