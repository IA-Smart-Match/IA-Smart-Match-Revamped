# Secret-scanning configuration.
#
# The full default rule set is kept — nothing is disabled, and no file and no
# rule is exempted. The single allowlist below exempts one literal string.

[extend]
useDefault = true

[[allowlists]]
description = """
tests/unit/test_forbidden_scanner.py asserts that the forbidden-behavior
scanner's `hard-coded-credential` rule fires on both the bare form
(api_key = "...") and the quoted form ("api_key": "..."). The quoted form is how
credentials most often actually get committed, and that gap was found by this
very self-test — so the assertion has to carry a literal shaped like a
credential.

`re_abcdefghijklmnop123456` is that literal: the alphabet from a to p followed
by 123456. No provider issued it, it authenticates nothing, and it exists only
so a gate that catches real credentials can be proven to work.

Scoped to the exact string rather than to the file or the rule, deliberately.
The file is still scanned for every other secret shape, and
`generic-api-key` still fires everywhere else in the tree and its history.
"""
regexTarget = "match"
regexes = ['''re_abcdefghijklmnop123456''']

[[allowlists]]
description = """
`docs/plans/perf-baseline-828.md` records the P4 performance baseline. To be
reproducible it has to show the exact command the measurement was taken with,
which means showing the dev principal the request authenticated as — once in
`SMARTMATCH_DEV_PRINCIPALS` and once in the `Authorization: Bearer` header of
the `curl` line. Two default rules fire on that pair: `generic-api-key` on the
JSON form and `curl-auth-header` on the header form.

`p4-perf-token` is that principal. It is a key in the `SMARTMATCH_DEV_PRINCIPALS`
fixture map, honored only when `SMARTMATCH_EDITION=dev` and
`SMARTMATCH_USE_FIXTURE_PROVIDERS=true`, against a loopback server. No provider
issued it, it authenticates nothing outside that dev fixture path, and a
benchmark whose command cannot be re-run is not a baseline.

Scoped to the exact string, matching the allowlist above: the file is still
scanned for every other secret shape, and both rules still fire everywhere else
in the tree and its history.
"""
regexTarget = "match"
regexes = ['''p4-perf-token''']
