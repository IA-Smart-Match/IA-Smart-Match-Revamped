# Container image build gate.
#
# This workflow builds the API and worker images and then proves each one
# starts and answers its health endpoint. The second half is the point: a build
# that succeeds and produces an image that cannot boot is a green check that
# means nothing, and packaging defects — a missing package, a path that only
# exists on the author's machine, a process that exits immediately as a
# non-root user — are exactly the class of defect that a build-only job passes
# straight over.
#
# ---------------------------------------------------------------------------
# Publication and deployment are deliberately out of scope.
# ---------------------------------------------------------------------------
# This workflow does not authenticate to any registry, does not tag an image
# for one, and does not push anywhere. It names no project id, no cloud
# account, and no deployment target, and it requests no permission beyond
# `contents: read` — in particular not `packages: write`. The migration
# contract sets ALLOW_CLOUD_DEPLOY=false, and that is a deliberate position
# rather than an oversight, so please do not casually add a push step here.
#
# Before a push step belongs in this repository, the following must be true:
#
#   * The container image scanning, signing, and provenance-attestation gates
#     must be running. They are listed as before-scale (R3+) gates at the
#     bottom of .github/workflows/verify.yml, which is the single place that
#     list is maintained; it is referenced rather than copied so the two cannot
#     drift. Publishing an unscanned, unsigned image is publishing something
#     nobody can later prove the provenance of.
#   * A destination must actually exist and be owned — a registry, with an
#     access policy, in an environment that architecture v1.1 §3.2 says shares
#     no project, database, queue, bucket, service account, or secret
#     identifier with any other environment.
#   * The credential for it must come from a configured secret binding, which
#     means a decision about who may release, not a value pasted into a
#     workflow.
#
# Until then this workflow's job is to prove the packaging works, and nothing
# more. Nothing built here is deployed, and nothing here should be read as a
# claim that either service is production-ready.
#
# Actions are pinned to immutable commit SHAs rather than tags, matching
# .github/workflows/verify.yml: a tag can be moved, and a moved tag in a
# workflow is a supply-chain compromise.

name: build

# ---------------------------------------------------------------------------
# Reusable: the deployment workflow calls this one
# ---------------------------------------------------------------------------
# `workflow_call` makes this workflow invokable by .github/workflows/deploy.yml,
# which runs it — and `verify` — as the gate before anything reaches the pilot
# VM. Nothing about what runs changes; the trigger is the only addition, and
# the permissions below still stop at `contents: read`, so being callable
# cannot become a way to reach a deployment credential from here.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Superseding an in-flight run is right for a pull request and wrong for
  # `deploy`: a cancelled gate there would abort the deployment that is
  # waiting on it, potentially while the VM is mid-migration. Pushes to
  # `deploy` therefore queue rather than cancel, and .github/workflows/deploy.yml
  # serializes the deployments themselves on its own never-cancelling group.
  cancel-in-progress: ${{ github.ref != 'refs/heads/deploy' }}

jobs:
  images:
    name: images — build, start, and probe
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      # Both services are reported even when one fails. Learning that the API
      # image is broken should not hide whether the worker image is too.
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: Dockerfile.api
            image: smartmatch-api:ci
            health_path: /api/health
            expected_body: '{"status":"ok","release":"ci"}'
          - service: worker
            dockerfile: Dockerfile.worker
            image: smartmatch-worker:ci
            health_path: /health
            expected_body: '{"status":"ok"}'

    env:
      # Deliberately neither 8080 nor 8000. Cloud Run supplies the listening
      # port through $PORT, so an image that only works on its own default
      # would fail there in a way no local run would reveal.
      PROBE_PORT: "9137"
      CONTAINER: smartmatch-${{ matrix.service }}-ci

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build image
        # No --push, no --tag pointing at a registry, no login. The tag is a
        # local name used by the steps below and by nothing else.
        run: |
          docker build -f "${{ matrix.dockerfile }}" -t "${{ matrix.image }}" .

      - name: Image runs as a non-root user
        # An image that runs as root gives a process compromise the whole
        # container. Asserted on the built artifact rather than read off the
        # Dockerfile, because the Dockerfile is the claim and the image is the
        # fact.
        run: |
          uid="$(docker run --rm --entrypoint sh "${{ matrix.image }}" -c 'id -u')"
          echo "container uid: $uid"
          if [ "$uid" = "0" ]; then
            echo "::error::${{ matrix.image }} runs as root"
            exit 1
          fi

      - name: Application directory is not writable by the application user
        # The virtualenv is root-owned so a compromised process cannot rewrite
        # an installed package and persist across a restart.
        run: |
          if docker run --rm --entrypoint sh "${{ matrix.image }}" \
               -c 'touch /opt/venv/.probe' 2>/dev/null; then
            echo "::error::the application user can write to /opt/venv"
            exit 1
          fi
          echo "/opt/venv is not writable by the application user"

      - name: No environment file, credential, or repository history in the image
        # The .dockerignore is the control; this is the check that the control
        # held. A build context leak is silent until someone goes looking.
        run: |
          # Public CA bundles are excluded by name, not by directory. Every
          # base image ships them -- /usr/lib/ssl/cert.pem, and a cacert.pem
          # vendored inside certifi under both the system interpreter and the
          # virtualenv -- so a bare "*.pem" match fires on every build. A gate
          # that always fails is a gate someone switches off, which is worse
          # than not having one. These are public certificates by definition;
          # the private material this step exists to catch is what remains.
          found="$(docker run --rm --entrypoint sh "${{ matrix.image }}" -c '
            find / -xdev \( -name ".env" -o -name ".env.*" -o -name "*.pem" \
                            -o -name "*.key" -o -name "*-credentials.json" \
                            -o -name "service-account*.json" \) \
                 -not -path "/etc/ssl/*" -not -path "/usr/share/ca-certificates/*" \
                 -not -path "/usr/lib/ssl/*" -not -path "*/certifi/*" \
                 ! -name "cert.pem" ! -name "cacert.pem" \
                 2>/dev/null
            ls -d /.git /src/.git 2>/dev/null
          ' || true)"
          if [ -n "$found" ]; then
            echo "::error::unexpected credential-shaped or version-control files in the image"
            echo "$found"
            exit 1
          fi
          echo "no environment files, credential-shaped files, or git history found"

      - name: No test suite or development tooling in the image
        # The final stage is meant to carry the runtime lock and the
        # application, not requirements/dev.txt tooling. This fails if a future
        # edit collapses the stages.
        run: |
          leaked="$(docker run --rm --entrypoint sh "${{ matrix.image }}" -c '
            ls /opt/venv/bin 2>/dev/null | grep -xE "pytest|mypy|ruff|lint-imports|pip-compile" || true
            ls -d /opt/venv/lib/python3.11/site-packages/tests 2>/dev/null || true
          ')"
          if [ -n "$leaked" ]; then
            echo "::error::development tooling or tests present in the runtime image"
            echo "$leaked"
            exit 1
          fi
          echo "no development tooling or tests in the runtime image"

      - name: Start the container
        # SMARTMATCH_RELEASE is the only configuration supplied, and it is not
        # a credential — it exists so a running instance can be identified
        # without the health response exposing any topology (v1.1 §1.11). No
        # provider configuration is passed, because none is needed: the
        # scaffold runs on fixtures.
        run: |
          docker run -d --name "$CONTAINER" \
            -e PORT="$PROBE_PORT" \
            -e SMARTMATCH_RELEASE=ci \
            -p "$PROBE_PORT:$PROBE_PORT" \
            "${{ matrix.image }}"

      - name: Health endpoint answers 200 with the expected body
        run: |
          url="http://127.0.0.1:$PROBE_PORT${{ matrix.health_path }}"
          for attempt in $(seq 1 30); do
            code="$(curl -s -o /tmp/health.body -w '%{http_code}' "$url" || true)"
            [ "$code" = "200" ] && break
            sleep 1
          done

          body="$(cat /tmp/health.body 2>/dev/null || true)"
          echo "status: ${code:-none}"
          echo "body:   $body"

          if [ "$code" != "200" ]; then
            echo "::error::${{ matrix.service }} health endpoint did not return 200"
            docker logs "$CONTAINER" || true
            exit 1
          fi
          if [ "$body" != '${{ matrix.expected_body }}' ]; then
            echo "::error::unexpected health body; expected ${{ matrix.expected_body }}"
            docker logs "$CONTAINER" || true
            exit 1
          fi

      - name: Container stops on SIGTERM rather than being killed
        # A rolling restart sends SIGTERM and waits. If the signal never
        # reaches the server — the classic shell-form CMD mistake, where the
        # shell is PID 1 and forwards nothing — the container survives until
        # the grace period expires and is then killed, taking every in-flight
        # request with it. `docker stop -t 10` makes that visible: a healthy
        # image stops in well under ten seconds.
        run: |
          started="$(date +%s)"
          docker stop -t 10 "$CONTAINER" >/dev/null
          elapsed="$(( $(date +%s) - started ))"
          echo "stopped in ${elapsed}s"
          if [ "$elapsed" -ge 10 ]; then
            echo "::error::SIGTERM was not handled; the container had to be killed"
            exit 1
          fi
          docker logs "$CONTAINER" 2>&1 | tail -20

      - name: Remove the container
        if: always()
        run: docker rm -f "$CONTAINER" >/dev/null 2>&1 || true

  compose-smoke:
    name: compose smoke — seeded queue, import, dispatch, review decision, metrics, web
    runs-on: ubuntu-24.04
    # 30 rather than 20: the stack now also builds and starts the `web`
    # service, whose first start runs `npm ci` into an empty volume. That is
    # minutes of dependency install on a cold runner, and a timeout sized for
    # the old five services would fail this job for being slow rather than
    # for being wrong.
    timeout-minutes: 30
    # Proves the documented docker-compose.yml stakeholder path (INSTALL.md §4)
    # works end to end, and that the review-decision loop actually moves a
    # metric:
    #
    #   seed-review leaves a demo queue of N pending items
    #     -> import -> scheduler dispatch -> pending_review_items N -> N+1
    #     -> review decision               -> back to N
    #     -> events import -> accept       -> pipeline_matched 0 -> 1
    #     -> the web dev server serves the portal route and proxies
    #        GET /v1/me as the seeded coordinator
    #
    # with NO manual dispatch step anywhere in it — the compose `scheduler`
    # sidecar is what drives the queued import to completion. The counts are
    # asserted as a change from the seeded baseline rather than against 0/1
    # literals, because the appliance is deliberately no longer expected to
    # come up with an empty review queue: a coordinator who opens it should
    # find something to act on. Same posture as
    # the `images` job above: no login, no push, no registry, no cloud
    # resource, and no permission beyond `contents: read`. The dev bearer
    # tokens and local task queue this exercises are a developer appliance
    # emulating Cloud Scheduler/Cloud Tasks, not an implementation of either —
    # see docker-compose.yml's header and
    # docs/operations/containers.md#the-local-scheduler-and-loopback-task-queue-compose-only.
    #
    # The sequence itself lives in scripts/compose_smoke.sh rather than being
    # spelled out again here. It is the same script INSTALL.md's smoke section
    # documents command by command, and keeping one implementation is what
    # stops the documented path and the enforced path from drifting apart —
    # the failure mode where CI stays green against a sequence no reader of
    # INSTALL.md is actually running.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Bring the stack up through the launcher
        # `./smartmatch.sh install` is the command README.md and INSTALL.md now
        # tell a reader to run, so it is the command this job runs. It
        # validates the compose file, checks for a port collision, builds,
        # starts every service including `web` and the one-shot `seed-review`,
        # and then waits on scripts/compose_health.sh rather than on a sleep.
        #
        # Running the launcher here rather than a bare `docker compose up` is
        # the point: the documented path and the enforced path are the same
        # path, so a launcher that breaks fails this job instead of failing on
        # a stakeholder's machine.
        env:
          SMARTMATCH_READY_TIMEOUT: "1200"
        run: ./smartmatch.sh install

      - name: The launcher's own status output agrees
        # `status --json` is a public interface — it is what a wrapper script or
        # a monitoring check would read. Asserting it here means its shape is
        # covered by CI rather than by whoever first tries to parse it.
        run: |
          ./smartmatch.sh status --json | tee /tmp/status.json
          python3 -c "
          import json, sys
          document = json.load(open('/tmp/status.json'))
          assert document['ok'] is True, document
          names = {service['service'] for service in document['services']}
          assert {'db', 'api', 'worker', 'scheduler', 'web'} <= names, names
          print('status --json:', len(document['services']), 'services, ok')
          "

      - name: Smoke the seeded queue -> import -> review -> metrics -> web path
        # scripts/compose_smoke.sh owns every assertion, exits non-zero on the
        # first stage that fails, and dumps the relevant service logs before it
        # does. It contains no `|| true` on any assertion, no swallowed exit
        # code, and no bare sleep standing in for a readiness check: every wait
        # is a bounded poll of the actual condition. In particular its stage 2
        # fails loudly and specifically on scheduler misconfiguration (a bearer
        # token that drifted from the worker's, or a worker with dispatch
        # unconfigured), rather than letting that surface later as a metric
        # poll that merely looks slow.
        # Its stage 3b is the equivalent guard for the `seed-review` one-shot:
        # a container that has already exited leaves nothing for `compose ps`
        # to look wrong about, so the script asserts its exit code and the
        # contents of the queue it was supposed to create. Stage 16 does the
        # same for `web` — serving, SPA route, and the /v1 proxy resolving to
        # the seeded coordinator's server-assigned role.
        #
        # Invoked through `./smartmatch.sh verify --full`, which runs the
        # bounded health suite first and then that script. The extra layer is
        # deliberate: `verify --full` is the documented command, and running
        # the script directly here would leave the documented one unexercised.
        run: ./smartmatch.sh verify --full

      - name: Service states and logs on failure
        if: failure()
        # The smoke script dumps logs itself when one of its own assertions
        # fails, but it is not the only way this job can fail — a service that
        # never starts fails the `up` step above, before the script runs at
        # all. This step is what makes that case readable rather than a bare
        # non-zero exit.
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Stop the stack and discard the data volume
        if: always()
        # -v so the database volume AND the web node_modules volume go with
        # it; a self-hosted or reused runner must not carry either into the
        # next run.
        run: docker compose down -v

  pilot-e2e:
    name: pilot e2e — auth, columns contract, accept AND reject, metrics, match, events, rewards, outreach
    runs-on: ubuntu-24.04
    # Same 30 as compose-smoke and for the same reason: `web`'s first start
    # runs `npm ci` into an empty volume, which is minutes on a cold runner.
    timeout-minutes: 30
    # The click-through `compose-smoke` above does not reach. That job proves
    # the appliance's documented happy path — seeded queue, import, dispatch,
    # ONE accept, the metric moving, the pipeline row, the web proxy. This one
    # walks the rest of what a coordinator actually does with it:
    #
    #   fixture auth (role read from GET /v1/me, never chosen by the caller)
    #     -> the columns.yaml contract refusing a malformed import
    #     -> a live import -> scheduler dispatch
    #     -> review ACCEPT *and* review REJECT (and a 409 on re-deciding)
    #     -> metrics read, and the drill-down rows behind the number
    #     -> a match run: score, shortlist, per-factor explanation
    #     -> events + tag quarantine
    #     -> rewards
    #     -> outreach: a consent-gated draft, the send COMMAND, the job's
    #        terminal state, and the delivery events recorded against the send
    #
    # and it is written to go red on DISHONESTY, not only on breakage. It fails
    # if a rank or score is mocked rather than computed (two runs differing in
    # one candidate's evidence must produce two different scores), if an
    # unknown is rendered as 0 (ADR-0011 — a candidate with no expertise record
    # must score null, while one with an empty record must score a classified
    # measured_zero), if a role could be chosen by the caller rather than
    # resolved from GET /v1/me, or if any match score is presented as a
    # percentage (the ratified G1 rules forbid it: the label is
    # "heuristic score", the shortlist is 2-3 speakers, and every score carries
    # its registry version).
    #
    # The outreach steps hold the same line for the send path. The 202 must
    # carry no field a client could render as "sent" (B17); the outcome is read
    # back from the job's summary and the send's own delivery events, never
    # inferred from the acknowledgement; `live_mode` is asserted false, so a
    # green run is one through the FIXTURE provider and never one bought by
    # mailing a stranger; and a recipient who unsubscribes after a coordinator
    # approved the draft must end the job `failed_policy` with a `blocked`
    # delivery event and no provider message id. Every address composed is
    # under RFC 2606's reserved `.invalid` TLD, which cannot resolve.
    #
    # Some steps CANNOT run on this appliance and are skipped by name rather
    # than faked — rewards is gated on the `student` role alone pending the D6
    # decision, so the coordinator principal is correctly refused; the portal
    # pages fetch /api/portals/*, which no service in this repository serves.
    # `-ra` in the `make e2e` target prints every skip in the summary, so a
    # step that did not run can never be mistaken for one that passed. Nothing
    # in that suite widens authorization to turn a refusal into a green check.
    #
    # Same posture as the two jobs above: no login, no push, no registry, no
    # cloud resource, no permission beyond `contents: read`, and fixtures only.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        # Hash-verified frozen install, matching verify.yml. The suite itself
        # needs only pytest and httpx, but installing the same locked set CI
        # installs everywhere else keeps one answer to "what is on the runner".
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements/dev.txt

      - name: Bring the stack up
        # The same single command INSTALL.md §4 tells a reader to run. `up -d`
        # returns once containers have STARTED, not once the one-shot
        # `seed-review` has FINISHED — the suite's own session fixture does the
        # bounded poll for that (`compose ps -a` until it reports `exited`)
        # rather than a sleep here. That race is exactly what PR #31 hit.
        run: docker compose up --build -d

      - name: Click through the synthetic pilot
        # `make e2e` owns the invocation, including the `-ra` that surfaces
        # every skip. It does not bring the stack up or tear it down, so the
        # `up` above and the always-run `down -v` below stay in this job, where
        # a failure still leaves logs to collect.
        #
        # PYTEST=pytest because the step above installed into the runner's own
        # interpreter rather than into ./.venv, which is what the target's
        # default $(VENV)/bin/pytest would look for.
        run: make e2e PYTEST=pytest

      - name: Service states and logs on failure
        if: failure()
        # The suite reports which step failed and why, but it is not the only
        # way this job can fail: a service that never starts fails the `up`
        # step above, before pytest collects anything.
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Stop the stack and discard the data volume
        if: always()
        run: docker compose down -v
