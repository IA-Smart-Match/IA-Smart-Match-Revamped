[project]
name = "smartmatch-providers"
version = "0.1.0"
description = "SmartMatch provider interfaces and fixture adapters"
requires-python = ">=3.11,<3.13"
dependencies = ["smartmatch-domain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smartmatch_providers"]
