[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Overridden at runtime by SMARTMATCH_DATABASE_URL; the value here is a local
# default carrying no credentials of consequence.
sqlalchemy.url = postgresql+psycopg://smartmatch:smartmatch@localhost:5432/smartmatch

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
