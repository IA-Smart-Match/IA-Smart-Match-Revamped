[project]
name = "smartmatch-persistence"
version = "0.1.0"
description = "SmartMatch PostgreSQL persistence — schema definitions and repositories"
requires-python = ">=3.11,<3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "smartmatch-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smartmatch_persistence"]
