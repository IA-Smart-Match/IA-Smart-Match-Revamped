[project]
name = "smartmatch-worker"
version = "0.1.0"
description = "SmartMatch private worker — Cloud Tasks target"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "smartmatch-domain",
    "smartmatch-authz",
    "smartmatch-providers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smartmatch_worker"]
