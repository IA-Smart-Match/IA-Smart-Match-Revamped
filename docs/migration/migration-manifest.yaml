  - id: MM-005
    legacy_path: "Category 3 - IA West Smart Match CRM/src/feedback/acceptance.py"
    legacy_symbol: "DECLINE_REASONS, REASON_TO_FACTOR, aggregate_feedback, generate_weight_suggestions"
    legacy_license: unlicensed-first-party
    target_path: python/smartmatch_domain/smartmatch_domain/feedback.py
    target_symbol: "aggregate, propose_weight_adjustments, DeclineReason, WeightProposal"
    disposition: ADAPT
    contract_refs: ["v1.1 Appendix B", "v1.1 §1.2", "v1.1 §5.5"]
    behavior_retained: >-
      The decline-reason vocabulary, the reason-to-factor mapping, the
      aggregation of accept/decline decisions, and the bounded weight-delta
      proposal (MAX_FACTOR_DELTA 0.08, PER_REASON_BUMP 0.03 carried forward from
