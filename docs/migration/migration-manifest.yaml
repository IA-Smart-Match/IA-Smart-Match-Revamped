  - id: MM-002
    legacy_path: "Category 3 - IA West Smart Match CRM/src/matching/{engine,factors,explanations}.py"
    legacy_symbol: "compute_match_score, rank_speakers, topic_relevance, role_fit, geographic_proximity, calendar_fit, historical_conversion, student_interest"
    legacy_license: unlicensed-first-party
    target_path: python/smartmatch_domain/smartmatch_domain/factor_registry.py (registry proposal only)
    target_symbol: PROPOSED_FACTORS, normalize_weights, assert_registry_approved
    disposition: ADAPT
    contract_refs: ["v1.1 §1.2", "v1.1 gate G1", "v1.1 Appendix C item 1"]
    behavior_retained: none yet — the scoring path is not ported
    behavior_rejected: >-
      Deferred pending gate G1. See docs/architecture/review/contract-findings.md
      finding F-001 for the measured defect.
    dependencies_removed: []
    data_provenance: n/a
    characterization_tests: >-
      Cannot be written. Characterization requires agreed-correct expected
      outputs, and the legacy's outputs are provably wrong (systematic ~10%
      deflation). Pinning them would enshrine the defect.
    target_tests: >-
      tests/unit/test_factor_registry.py asserts the corrected normalization
      invariant and that scoring fails closed while the gate is open.
    security_review: n/a
    migration_owner: engineering
    reviewer: pending
    status: blocked_contract
    blocking_owner: program owner (named in v1.1 gate G1)
    notes: >-
      The orchestrator contract §Phase 5 states: "Start with pure matching
      behavior only if factor definitions and golden cases are resolved.
      Otherwise record it as blocked." Recorded as blocked. The registry
      proposal is committed so the contradiction is resolved in the open, and
      assert_registry_approved() fails closed so no scoring path can ship before
      the gate closes.
      Amended 25 August 2026 after the stakeholder test-log audit. The seven
      factors she was shown must be mapped onto the nine proposed, and the
      mapping recorded rather than left implicit: calendar_fit becomes
      availability (Stage A), while historical_conversion and student_interest
      have no target in the proposed registry and no decision either way. That
      silence is the current state and it is worse than either answer — it is
      raised as Q6 in docs/plans/stakeholder-audit-integration.md §9, owned by
      the program owner at gate G1. Her three observed symptoms become required
      golden cases for G1: the exact 43% tie, "Topic Relevance 0%" on an event
      about AI, and "Match Depth 0". Per ADR-0011, each of those zeroes is
      either a real measured zero that needs an explanation or a missing value
      wearing a zero's clothes, and nothing in the legacy distinguishes them —
      so the golden case must pin which it is.

