  - id: MM-A01
    legacy_path: "Category 3 - IA West Smart Match CRM/src/api/routers/portals.py:435"
    legacy_symbol: 'POST /auth/mock-login'
    disposition: ARCHIVE
    contract_refs: ["v1.1 §1.11", "v1.1 §2.2"]
    behavior_rejected: >-
      Caller-selected identity. The single most dangerous pattern in the
      baseline. Identity and tenant are derived server-side from a verified
      token. tests/contract/test_api_health.py asserts the endpoint returns 404,
      and tools/scan_forbidden.py fails the build if the pattern reappears.
    status: archived

  - id: MM-A02
    legacy_path: "Category 3 - IA West Smart Match CRM/src/runtime_state.py, src/coordinator/result_bus.py"
    legacy_symbol: module-level dictionaries, queues, and result buses
    disposition: ARCHIVE
    contract_refs: ["v1.1 §1.6", "v1.1 §2.4"]
    behavior_rejected: >-
      Authoritative state in process memory. Incorrect across multiple Cloud Run
      instances: a job written by one instance is invisible to another, and an
      instance restart loses it entirely. Replaced by the job/job_event/outbox
      tables with transactional counters and leases.
    status: archived

  - id: MM-A03
    legacy_path: "Category 3 - IA West Smart Match CRM/src/demo_mode.py, cache/demo_fixtures/*.json"
    legacy_symbol: "load_fixture, DEMO_MODE, populated-screen fallbacks"
    disposition: ARCHIVE
    contract_refs: ["v1.1 §5.5", "v1.1 §3.6 N3"]
    behavior_rejected: >-
      Serving seed content unlabeled so a screen stays populated. v1.1 §5.5 names
      this the anti-pattern the provenance component family exists to kill.
      Fixture providers in the target return visibly synthetic results
      (provider_message_id prefixed "fixture-") and never substitute for a
      failed call.
    status: archived

  - id: MM-A04
    legacy_path: "Category 3 - IA West Smart Match CRM/data/{demo.db,smartmatch.db}, data/feedback/feedback-log.jsonl"
    legacy_symbol: SQLite and JSONL business persistence
    disposition: REPLACE
    contract_refs: ["v1.1 §3.1", "v1.1 §2.2"]
    behavior_rejected: >-
      Business records in repository-local files. PostgreSQL is the single system
      of record. .gitignore blocks these patterns and CI fails if one is tracked.
    status: archived

  - id: MM-A05
    legacy_path: "Category 3 - IA West Smart Match CRM/src/app.py, src/ui/**"
    legacy_symbol: Streamlit application and 20 UI modules
    disposition: ARCHIVE
    contract_refs: ["v1.1 §5.1"]
    behavior_rejected: >-
      Streamlit is not the target frontend; v1.1 §5.1 specifies React + TypeScript
      + Vite consuming a generated client. The design-system decisions are worth
      revisiting when apps/web is built (MM-F01), but no Streamlit code carries
      forward.
    status: archived

  - id: MM-A06
    legacy_path: "Category 3 - IA West Smart Match CRM/src/voice/{stt,tts}.py"
    legacy_symbol: Whisper STT and KittenTTS voice experiments
    disposition: ARCHIVE
    contract_refs: ["v1.1 §1.1"]
    behavior_rejected: >-
      Outside target scope. No accepted contract restores voice as a production
      capability; per §8 of the orchestrator contract, experiments are archived
      unless a contract restores them separately.
    status: archived

  - id: MM-A07
    legacy_path: "Category 3 - IA West Smart Match CRM/src/coordinator/**"
    legacy_symbol: "nemoclaw_adapter, intent_parser, in-request agentic stream, tools/*"
    disposition: REPLACE
    contract_refs: ["v1.1 §1.4", "v1.1 §1.6", "v1.1 gate G3"]
    behavior_rejected: >-
      In-request agent orchestration with provider calls in the browser request
      path. v1.1 §1.6 requires every consequential action be persisted as a
      command and dispatched through the outbox. Agents ship in R3 behind gate
      G3 (eval set, tool allowlist, cost controls approved), inside the worker
      boundary. The useful requirement — a conversational surface over typed
      capabilities — survives as the Jarvis design in v1.1 §1.4.
    status: archived

  - id: MM-A08
    legacy_path: "Category 3 - IA West Smart Match CRM/src/scraping/scraper.py"
    legacy_symbol: crawl orchestration and extraction
    disposition: REPLACE
    contract_refs: ["v1.1 §1.5", "v1.1 gate G3"]
    behavior_rejected: >-
      Deferred to R3 pending the crawler threat model (SSRF, DNS rebinding,
      redirect escape, decompression bombs, size/type/time limits,
      prompt-injection isolation of fetched content). Per the expected first port
      batch, this candidate is "security review first" — that review has not
      happened, so nothing is ported.
    status: archived
    notes: Not yet inventoried in depth; revisit at R3 with a security reviewer.

