    legacy_symbol: crawl orchestration and extraction
    disposition: REPLACE
    contract_refs: ["v1.1 §1.5", "v1.1 gate G3", "ADR-0010", "ADR-0012"]
    behavior_rejected: >-
      Deferred to R3 pending the crawler threat model (SSRF, DNS rebinding,
      redirect escape, decompression bombs, size/type/time limits,
      prompt-injection isolation of fetched content). Per the expected first port
      batch, this candidate is "security review first" — that review has not
      happened, so nothing is ported.
    status: archived
    notes: >-
      Not yet inventoried in depth; revisit at R3 with a security reviewer.
      Amended 25 August 2026: this disposition archives the legacy crawler's
      *code*, and said nothing about the shape of its *output*, so a rebuilt
      crawler could reproduce every data-quality defect in the stakeholder test
      log honestly. Two invariants are carried here so R3 inherits them rather
