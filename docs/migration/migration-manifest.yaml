schema_note: >-
  Three fields were added on 26 August 2026, per
  docs/plans/defect-remediation.md §3.3, and applied only to the entries that
  need them rather than backfilled across the file.

  `behavior_introduced` — the schema had `behavior_retained` and
  `behavior_rejected` and no third box, so a port that improves on the legacy
  had nowhere truthful to say so and the claim migrated to the nearest
  available field. That is how MM-003's genuine time-based recency decay came
  to be filed under "retained" (the softer half of finding F-4) and how MM-004's
  escalation of a warning to an error became an "Added:" sentence inside
  `behavior_rejected` (finding F-12). This removes a recurring failure mode
  rather than one instance of it.

  `behavior_replaced` — used on MM-005, where a vocabulary and a mapping were
  neither retained nor rejected but redesigned. Filing a replacement as
  retention is what findings F-18 and F-19 are.

  `corrections` — per docs/plans/defect-remediation.md §5 measure 2. The
  manifest already carries `reviewer`; it did not distinguish *who corrected*
  from *who verified*, and the correcting author is now part of an entry's
  provenance. A re-reviewer who cannot see what changed since the rejection has
  to re-review everything or trust the summary, and neither is what is wanted.

  A fourth change that §3.3 recommends is NOT made here: removing the test
  counts from `target_tests`. The counts have been corrected to measured values
  instead, which satisfies the §3.1 conditions ("corrected to N, or counts
  removed"). Removing them would be the better answer only alongside the
  machine check §3.3 pairs it with — a test that reads this manifest and asserts
  that every path named in `characterization_tests` and `target_tests` exists,
  and that the stated counts match `pytest --collect-only`. That check does not
  exist, and writing it was outside this correction's authority (tests/).
  **It is the single change that would have caught F-13, a High finding, on the
  day it was written**, and it is recommended to whoever owns the schema next.
  Until it exists, every count in this file is a number someone has to
  re-measure by hand, which is the defect F-5 and F-14 are two instances of.

