  - id: MM-F03
    legacy_path: "Category 3 - IA West Smart Match CRM/frontend/src/lib/{studentPoints.ts,studentRewardsCatalog.ts}, frontend/src/app/student/**"
    legacy_symbol: "getStudentTotalPoints, STUDENT_REWARD_CATALOG, getSortedCatalog, StudentRewardItem"
    disposition: REPLACE
    contract_refs: ["v1.1 §2.2", "v1.1 §3.6 N1", "ADR-0013"]
    behavior_rejected: >-
      A browser-computed points balance is not a balance.
      getStudentTotalPoints returns attendance_streak * 100 + events_attended *
      25 from two summary counters in the client, with no server-side record, no
      history, no reversal path and no audit trail — and its own docstring calls
      it a "demo formula", so the legacy authors did not believe it was a balance
      either. It was rendered to students as one. The catalog compounds it: seven
      pointsCost values of 2,500 / 3,200 / 5,000 / 8,500 / 12,000 / 15,000 /
      45,000, which against attendance at 25 points per event puts the cheapest
      item at 100 events attended and the dearest at 1,800. Replaced by the
      append-only point_ledger_entry of ADR-0013, folded server-side, derived
      from attendance and nothing else. One property carries forward:
      getSortedCatalog sorts ascending by cost, so free-to-give items sort first
      by construction rather than editorially. None of the seven costs is
      retained; they are content to re-price under D6 and D7.
    status: inventoried
    notes: >-
      Not ported: apps/web does not exist and is ON HOLD behind D-0, and the
      tables land in R2 alongside attendance and QR check-in (MM-F02). Design in
      docs/architecture/engagement-model.md; backlog S6-S9. Fix #9 and Fix #15
      of the stakeholder test log, 19-20 August 2026.

  - id: MM-F04
    legacy_path: "Category 3 - IA West Smart Match CRM/frontend/src/app/student/StudentConnect.tsx"
    legacy_symbol: in-app peer chat surface
    disposition: ARCHIVE
    contract_refs: ["v1.1 §2.3", "ADR-0014"]
    behavior_rejected: >-
      In-app chat is cut — a decision taken by Dr. Ann Wang in the 19-20 August
      2026 session (Fix #11), not an engineering deferral. It is recorded here
      and in ADR-0014 so it reads as a decision rather than as an omission. The
      surface also disclosed peer attendance with no consent record governing
      who may see that a student was present.
    status: archived
    notes: >-
      One requirement is retained rather than archived with it: "people you met
      at this event", which ADR-0014 gates on an active disclosure_consent
      covering the viewer, and whose connect action is an opt-in LinkedIn URL the
      person supplied themselves. Deeper access is a coordinator-mediated mentor
      request, not a peer-to-peer channel. Backlog S10; policy is D8, owned by
      privacy / legal / records, which must also settle what the phrase
      "FERPA-aware" asserts (test-log kickoff Q35).
