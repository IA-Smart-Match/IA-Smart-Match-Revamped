  - id: MM-A08
    legacy_path: "Category 3 - IA West Smart Match CRM/src/scraping/scraper.py"
    legacy_symbol: crawl orchestration and extraction
    disposition: REPLACE
    contract_refs: ["v1.1 §1.5", "v1.1 gate G3", "ADR-0010", "ADR-0012"]
    behavior_rejected: >-
      Deferred to R3 pending the crawler threat model (SSRF, DNS rebinding,
      redirect escape, decompression bombs, size/type/time limits,
      prompt-injection isolation of fetched content). Per the expected first port
      batch, this candidate is "security review first" — that review has not
      happened, so nothing is ported.
    status: archived
    notes: >-
      Not yet inventoried in depth; revisit at R3 with a security reviewer.
      Amended 25 August 2026: this disposition archives the legacy crawler's
      *code*, and said nothing about the shape of its *output*, so a rebuilt
      crawler could reproduce every data-quality defect in the stakeholder test
      log honestly. Two invariants are carried here so R3 inherits them rather
      than rediscovering them after the same bug report. ADR-0010 — extraction
      maps dates onto a precision enum (exact / date_only / unresolved) instead
      of producing a datetime unconditionally; an unresolved event cannot become
      matchable or publishable. ADR-0012 — events resolve by a deterministic key
      (host org unit, normalized title, resolved date window) so re-crawling
      updates rather than duplicates; source provenance is a structured field
      and never part of the title; role and type tags come from a closed
      versioned vocabulary, with unmapped values quarantined rather than
      rendered or matched on. Neither alters the gate: R3 still requires the
      crawler threat model first.

  - id: MM-A09
    legacy_path: >-
      Category 3 - IA West Smart Match CRM/data/{data_speaker_profiles.csv,data_cpp_events_contacts.csv,poc_contacts.json,pipeline_sample_data.csv},
      archived/Categories list/Category 3 IA West Smart Watch/{data_speaker_profiles.csv,data_cpp_events_contacts.csv}
    legacy_symbol: real-identity datasets tracked in git
    disposition: ARCHIVE
    contract_refs: ["v1.1 §2.3", "v1.1 §5.5"]
    behavior_rejected: >-
      Six tracked paths at legacy_sha bdce024 carry named real people. Verified
      by header and row count; contents deliberately not reproduced here.
      (1) data/data_speaker_profiles.csv — 18 data rows; header
      "Name,Board Role,Metro Region,Company,Title,Expertise Tags".
      (2) data/data_cpp_events_contacts.csv — 15 data rows, including
      "Point(s) of Contact (published)" and "Contact Email / Phone (published)".
      (3) data/poc_contacts.json — five named individuals with @cpp.edu
      addresses, org and role, each carrying comm_history, last_contact and
      follow_up_due. This is a communications and follow-up log, not a contact
      list: it records who was approached, when, and what was said, which is a
      materially different disclosure from a name and a title.
      (4) data/pipeline_sample_data.csv — 58 data rows pairing speaker_name with
      match_score, rank and stage, so it attributes a computed score to a named
      person.
      (5) and (6) the two archived/ paths are byte-identical duplicates of (1)
      and (2) — cmp reports no difference. A remediation that removes four
      leaves two intact.
    status: archived
    migration_owner: engineering
    blocking_owner: unassigned — see docs/plans/stakeholder-audit-integration.md §9 Q1
    notes: >-
      Nothing is ported from these paths; ARCHIVE is the disposition for the
      target repository and is already satisfied. The finding is about the
      legacy repository, and archiving does not close it. These files are
      tracked in git history, so deleting them at HEAD or taking the Vercel
      deployment down does not remove them — only a history rewrite or a
      repository replacement does, and both are decisions rather than
      engineering tasks (Q1). This gates kickoff Q11 (may the repository be
      open-sourced) and backlog D9: publishing history containing these paths
      would broaden the exposure rather than preserve it. No write to the legacy
      repository has been made or is authorized; the orchestrator contract
      forbids it without authorization. MM-A04 covers data/{demo.db,
      smartmatch.db} and data/feedback/feedback-log.jsonl, which are business
      persistence rather than identity data; none of the six paths here appears
      in that entry or anywhere else in this manifest. Severity 1 in the
      stakeholder test log of 19-20 August 2026 (Fix #1) — the only severity-1
      item in it. See docs/architecture/review/stakeholder-test-log-audit.md.

