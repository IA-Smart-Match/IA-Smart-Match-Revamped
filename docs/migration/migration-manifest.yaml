    status: ported_unverified
    verification_notes: >-
      Independently reviewed 18 Aug 2026; NOT approved. See docs/migration/port-verification.md. Findings F-18/F-19 (decline vocabulary and reason-to-factor mapping were replaced, not retained), F-21 (claimed substring-matching defect does not reproduce in the legacy), F-22, F-20, F-23, F-24, F-25, F-26, F-27.
    completion_commit: 7b5ab9f

