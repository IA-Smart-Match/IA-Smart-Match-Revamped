entries:
  - id: MM-001
    legacy_path: "Category 3 - IA West Smart Match CRM/src/outreach/ics_generator.py"
    legacy_symbol: "generate_ics, _escape_ics_text, _make_uid, _parse_date"
    legacy_license: unlicensed-first-party
    target_path: python/smartmatch_domain/smartmatch_domain/ics.py
    target_symbol: "generate_ics, CalendarInvite, _fold_line, _escape_text"
    disposition: ADAPT
    contract_refs: ["v1.1 §3.1", "v1.1 §3.6", "v1.1 §5.5"]
    behavior_retained: >-
      Pure RFC 5545 string building with no external library; the VCALENDAR and
      VEVENT envelope; deterministic UID derivation so a regenerated invite
      updates rather than duplicates; CRLF line endings; TEXT escaping of
      backslash, semicolon, comma, and newline; omission of absent optional
      fields; the one-hour default duration.
    behavior_rejected: >-
      Three defects, each now covered by a golden test that fails against the
      legacy. (1) Unparseable dates silently became "30 days from now",
      fabricating a meeting slot nobody chose — prohibited by v1.1 §3.6 N1;
      generate_ics now requires a resolved timezone-aware datetime and raises
      UnschedulableEventError otherwise. (2) Naive datetimes were formatted with
      a trailing Z, asserting UTC for a value that had no timezone and shifting
      the event by the local offset in every consuming calendar. (3) No RFC 5545
      §3.1 line folding, so long SUMMARY/DESCRIPTION values produced documents
      strict parsers reject; folding is now octet-based and never splits a
      multi-byte codepoint.
    dependencies_removed: ["logging (module-level logger)", "implicit clock reads"]
    data_provenance: no data; pure string generation
    characterization_tests: tests/golden/test_ics_golden.py (7 preserved-behavior cases)
    target_tests: tests/golden/test_ics_golden.py (8 corrected-behavior cases, 15 total)
    security_review: >-
      No IO, no network, no secrets. UID namespace uses a .invalid TLD rather
      than a real domain, since domain registration is open decision 8 and a real
      domain would imply mail routing that does not exist.
    migration_owner: engineering
    reviewer: A4 (independent review agent)
    status: verified
    verification_notes: >-
      Independently reviewed 18 Aug 2026; see docs/migration/port-verification.md. Verified with findings: all three claimed legacy defects reproduce against the legacy source. Open findings F-1 (METHOD:REQUEST emitted with no ORGANIZER/ATTENDEE, RFC 5546 3.2.2), F-2, F-3.
    completion_commit: 7b5ab9f
    notes: >-
      Verified 18 Aug 2026 by a reviewer other than the author, per §6 of the
      orchestrator contract. The verdict is "verified with findings": the three
      claimed legacy defects were each reproduced against the legacy source, and
      three further findings (F-1..F-3) are open against the target. F-1 is the
      substantive one — METHOD:REQUEST is emitted with no ORGANIZER or ATTENDEE,
      which RFC 5546 §3.2.2 requires — and is tracked for R2 alongside the
      delivery path that will actually send these invites. None blocks the entry,
      because none is a regression against the legacy.

  - id: MM-003
    legacy_path: "Category 3 - IA West Smart Match CRM/src/matching/factors.py"
    legacy_symbol: "volunteer_fatigue, volunteer_recovery_details, _recurrence_pressure"
    legacy_license: unlicensed-first-party
    target_path: python/smartmatch_domain/smartmatch_domain/eli.py
    target_symbol: "compute_eli, evaluate_cap, load_penalty, LoadInputs, EliSnapshot"
    disposition: REPLACE
    contract_refs: ["v1.1 §1.3", "v1.1 §2.2", "v1.1 §5.1"]
    behavior_retained: >-
      The shape of the computation only: recent assignment pressure, travel
      burden, and event cadence combined into a bounded score, with recency
      weighting.
    behavior_rejected: >-
      The health framing and its coordinator-facing labels ("Rest Recommended",
      "Needs Rest"), which implied an assessment SmartMatch has no evidence to
      make. The inference from a pipeline `stage_order` column to
      "days_since_last_assignment", which invented a number the data never
      contained. The single blended score with no separable hard cap — v1.1 §1.3
      requires the cap (Stage A) and the penalty (Stage B) be applied and
      reported separately. The pandas DataFrame coupling.
    dependencies_removed: ["pandas", "src.config constants", "geographic_proximity"]
    data_provenance: operational workload facts only; prohibited-input list enforced by schema
    characterization_tests: n/a — REPLACE, not a port; legacy outputs are not a target
    target_tests: tests/unit/test_eli.py (20 cases)
    security_review: >-
      Closed input structure (LoadInputs) means a prohibited field cannot reach
      the computation. Prohibited-input list asserted in
      tests/unit/test_factor_registry.py.
    migration_owner: engineering
    reviewer: A4 (independent review agent)
    status: ported_unverified
    verification_notes: >-
      Independently reviewed 18 Aug 2026; NOT approved. See docs/migration/port-verification.md. Findings F-4 (behavior_retained names an event-cadence input the module does not have), F-5 (test count), F-6 (Stage A cap boundary set by a 4-dp rounding), F-7, F-8, F-9, F-10.
    completion_commit: 7b5ab9f
    notes: >-
      Decay half-life (45d), rolling window (90d), and modifier weighting are
      proposed defaults. Open decision 2 assigns final parameters to the program
      owner.

