      surface also disclosed peer attendance with no consent record governing
      who may see that a student was present.
    status: archived
    notes: >-
      One requirement is retained rather than archived with it: "people you met
      at this event", which ADR-0014 gates on an active disclosure_consent
      covering the viewer, and whose connect action is an opt-in LinkedIn URL the
      person supplied themselves. Deeper access is a coordinator-mediated mentor
      request, not a peer-to-peer channel. Backlog S10; policy is D8, owned by
      privacy / legal / records, which must also settle what the phrase
      "FERPA-aware" asserts (test-log kickoff Q35).

