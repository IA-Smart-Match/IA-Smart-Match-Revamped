# SmartMatch pilot import column contract -- RATIFIED for the pilot.
#
# Ratified 28 Aug 2026. This file was a proposal; both questions it originally
# could not answer from evidence already in the repository are now resolved --
# P9 Gate A (board_role) and P9 Gate B (published contact fields), both closed
# 2 Sep 2026 -- see OPEN QUESTIONS below for each gate's resolution note.
# Ratified means "this is the contract the pilot import path is held to", not
# "every question about these columns was settled on day one".
#
# WIRED as of 2 Sep 2026 (P9 card W1). smartmatch_worker.column_contract
# reads this file and smartmatch_worker.handlers hands the declarations below
# to smartmatch_domain.ingest.validate_columns, so an inline-rows import is
# now held to this contract rather than to required=(), optional=(). This
# file is the single source of truth: no column name is repeated in Python.
# Enforcement is SECTION-LEVEL, per card W1's partial-ratification rule --
# a column still behind an open question would be declared under its
# dataset's `gate_pending` map and neither enforced nor treated as ratified.
# No column is gate-pending today: Gate A's board_role and Gate B's three
# contact fields were the only entries, and both gates have since closed. The
# mechanism is unchanged and stays in place for the next column a gate has
# not yet answered. See "GATE-PENDING COLUMNS" below.
# See docs/pilot-data/README.md for the finding this fills (F-28 / migration
# manifest: architecture v1.1 Section 1.5 is not in this repository, so the
# "real" column contract it might define has never been read). Ratifying
# this does not close F-28 -- it cannot cite a section that is not present.
#
# Column names are quoted verbatim as a coordinator's export would spell them.
# smartmatch_domain.ingest.normalize_header() compares them case- and
# punctuation-insensitively, so "Metro Region", "metro_region", and
# "  Metro-Region " are the same declared column -- but declaring the SAME
# name twice (once under required, once under optional) is a caller bug that
# validate_columns raises ValueError on, so each column below is listed once.
#
# WHAT WAS DECIDED HERE
#
#   1. The professionals name column is `name`, not `full_name`. The proposal
#      preferred `full_name` because tests/unit/test_ingest.py spells it that
#      way, but that test uses the name as an illustrative example, not as a
#      contract; `name` is the spelling on the frontend surface
#      (mockData.ts's Specialist type), which is where a coordinator's export
#      and the pilot UI actually meet. Every professionals fixture was
#      renamed to match.
#
#   2. blank_sentinels are declared PER COLUMN, not once per dataset. This
#      closes the gap the proposal could only flag: one global set meant that
#      declaring "NULL" to clean up a blank metro_region also blanked a
#      professional genuinely surnamed "Null", in every field on their row.
#      validate_columns now takes `blank_sentinels_by_column`, and a column
#      named there uses only its own set -- so a sentinel can be declared
#      where it is a placeholder and withheld where it is a value. The
#      dataset-wide `blank_sentinels` below is deliberately empty: sentinels
#      are declared positively, column by column, so that a column added
#      later inherits nothing by accident. See
#      docs/pilot-data/fixtures/professionals_null_surname_and_null_region.json
#      and the assertion it backs in verify_fixtures.py.
#
#   3. Sentinels are declared only for REQUIRED columns. Today they feed
#      exactly one check -- required_column_entirely_blank -- so a sentinel on
#      an optional column would be inert, and declaring inert things hides the
#      ones that do work. Extend the declarations when a check needs them.
#
#   4. P9 Gate A closed 2 Sep 2026
#      (docs/decisions/p9-gate-a-board-role-decision-draft.md): board_role is
#      relationship-scoped, not a flat professional attribute -- it varies by
#      (professional, unit), and multiple concurrent roles for the same
#      person across different units must be representable at once. It is
#      REMOVED from `professionals.optional` below and from `gate_pending`
#      (there is nothing left to accept-and-flag; the modelling question is
#      answered). The column now lives on the `professional_unit_relationship`
#      table (python/smartmatch_persistence/smartmatch_persistence/schema.py,
#      migration db/migrations/versions/0012_professional_unit_relationship.py)
#      with NO effective_from / effective_to columns -- the pilot is
#      current-state only per the gate record's §2. This import contract does
#      not carry board_role at all; a coordinator's export naming it now
#      reports `unexpected_columns`, the same as any other column this
#      contract does not declare.
#
#   5. `url_shaped_columns` (see events, below) names columns
#      smartmatch_worker.handlers validates with
#      smartmatch_domain.public_url.validate_static_url_shape before an
#      import writes them -- the four static HTTPS shape rules in that
#      module's docstring. A candidate that fails is never rejected outright
#      and never silently dropped: it is reported as a `url_shape_invalid`
#      WARNING finding naming the column and the failing rule, and the value
#      is still stored exactly as submitted for a coordinator's review -- the
#      same quarantine-and-review posture every other finding in this
#      contract already has. Declared per dataset, like
#      `blank_sentinels_by_column`, so a column is checked only where it is
#      declared to hold a URL.
#
# GATE-PENDING COLUMNS
#
#   A column still behind an open question would be declared twice: in prose
#   under open_questions (unchanged, for a human), and machine-readably under
#   its dataset's `gate_pending` map (for the worker) -- card W1 is explicit
#   that W1 "must not treat a still-open open_questions entry as ratified
#   contract". No dataset below declares one today: Gate A's board_role and
#   Gate B's three contact fields were the only entries this file ever
#   carried, and both gates have since closed (see decision 4 above and
#   OPEN QUESTIONS below). The mechanism remains for the next column a gate
#   has not yet answered. Each entry, when one exists, names the gate that
#   owns the column and one of two postures:
#
#     accept   -- recognized, persisted normally, and reported in a
#                 `columns_pending_gate` WARNING so a coordinator sees the
#                 meaning is unsettled. Used where the open question is about
#                 MODELLING -- P9 Gate A's board_role was this posture's first
#                 and, so far, only example.
#
#     withhold -- recognized, but the values are DROPPED before anything is
#                 written, reported in a `columns_withheld_pending_gate`
#                 WARNING naming every column withheld. Used where the open
#                 question is PRIVACY -- P9 Gate B's three contact fields were
#                 this posture's example, while Gate B stayed open: quarantine
#                 is collection, and a review_item row is persistence
#                 (ADR-0014). Accepting the import while declining to store
#                 the value is the only posture that neither invents an
#                 authorization nor discards the rest of a coordinator's
#                 submission.
#
#   Neither posture REJECTS. A gate-pending column never makes a dataset
#   unusable -- refusing would be enforcing an answer the gate has not given
#   either. When a gate closes, delete that column's gate_pending entry and
#   its open_questions paragraph together; leaving one without the other is
#   how a contract starts lying.

datasets:
  professionals:
    description: >-
      Professionals / volunteers -- the people who speak or mentor. Column
      names and the required/optional split are derived from two existing
      sources, not invented for this contract:
        1. apps/web/legacy-frontend/src/lib/mockData.ts's Specialist type
           (orphaned -- nothing imports it -- used here for shape and
           vocabulary only) supplies `name` and the optional fields company,
           title, expertise_tags, initials. mockData.ts also carried
           board_role as a flat field on Specialist; P9 Gate A decided
           (2 Sep 2026) that it is relationship-scoped instead, so it is not
           part of this dataset -- see decision 4 in WHAT WAS DECIDED HERE
           and the `professional_unit_relationship` table.
        2. tests/unit/test_ingest.py supplies metro_region as the second
           required column and "pronouns" as an optional one. That file also
           spells the name column `full_name`; ratification chose `name`
           instead, for the reason in the header.
    required:
      - name
      - metro_region
    optional:
      - company
      - title
      - expertise_tags
      # board_role removed 2 Sep 2026 -- P9 Gate A closed relationship-scoped
      # (see decision 4 in WHAT WAS DECIDED HERE, above). It is no longer a
      # professionals column at all: it lives on
      # `professional_unit_relationship`, keyed by (tenant_id,
      # professional_id, unit_id), with no effective-date columns for the
      # pilot. A coordinator's export still naming board_role here now
      # reports `unexpected_columns`, not `columns_pending_gate` -- the
      # question this posture was flagging is answered.
      - initials
      - pronouns
    # Empty on purpose -- this is the fallback for any column not named
    # below, and nothing should fall back into a sentinel it was never given.
    blank_sentinels: []
    blank_sentinels_by_column:
      # A coordinator's export writes these three for an empty cell.
      metro_region: &null_markers ["NULL", "nan", "N/A"]
      # Explicitly none: "Null" is a real surname (see
      # professionals_null_surname_and_null_region.json) and "None" is a real
      # place-name fragment. Stated rather than left to the empty fallback, so
      # that anyone who later adds a dataset-wide sentinel cannot silently
      # start blanking people's names.
      name: []

  events:
    description: >-
      Events / programs -- the sessions professionals are matched to. Column
      names are taken verbatim from mockData.ts's CppEvent type, including
      its punctuation and casing (e.g. "Event / Program", "Host / Unit").
      CppEvent marks "Event / Program" and "Category" as required (no `?`)
      and everything else optional (`?`); this contract keeps that split.
      Two CppEvent optional fields -- "Public URL" and
      "Point(s) of Contact (published)" / "Contact Email / Phone
      (published)" -- were declared here for completeness before any fixture
      exercised them; P9 Gate B closed 2 Sep 2026 collecting all three (see
      OPEN QUESTIONS for the resolution note).
    required:
      - "Event / Program"
      - "Category"
    optional:
      - "Recurrence (typical)"
      - "Host / Unit"
      - "Volunteer Roles (fit)"
      - "Primary Audience"
      - "Public URL"
      - "Point(s) of Contact (published)"
      - "Contact Email / Phone (published)"
    blank_sentinels: []
    blank_sentinels_by_column:
      # Both are institutional strings -- a program is not titled "N/A" and a
      # category is not named "NULL" -- so the markers are safe here. Note
      # that "Point(s) of Contact (published)" carries people's names and
      # would need the same withholding as professionals.name; it is
      # optional, so it takes no declaration today (see decision 3).
      "Event / Program": *null_markers
      "Category": *null_markers
    # See decision 5 in WHAT WAS DECIDED HERE, above. "Public URL" is the
    # only column any dataset declares here today; smartmatch_worker.handlers
    # runs smartmatch_domain.public_url.validate_static_url_shape against it
    # for every row that carries a value, and a shape failure becomes a
    # `url_shape_invalid` WARNING finding rather than a rejection or a
    # silent drop.
    url_shaped_columns:
      - "Public URL"

open_questions:
  - >-
    RESOLVED 2026-09-02 -- P9 Gate A closed: "board_role" is relationship-
    scoped, not intrinsic to a professional record -- it varies by
    (professional, unit), with multiple concurrent roles per person across
    different units representable at the same instant, and no
    effective_from / effective_to columns for the pilot (current-state only).
    See docs/decisions/p9-gate-a-board-role-decision-draft.md §§1-2. The
    column is removed from `professionals.optional` above and now lives on
    the `professional_unit_relationship` table
    (python/smartmatch_persistence/smartmatch_persistence/schema.py,
    migration db/migrations/versions/0012_professional_unit_relationship.py).
  - >-
    RESOLVED 2026-09-02 -- P9 Gate B closed: collect all three (Public URL;
    Point(s) of Contact (published); Contact Email / Phone (published)) per
    docs/decisions/p9-gate-b-contact-fields-worksheet.md §8. Human/import
    origin only for contact fields; crawler raw URL persistence still requires
    an approved host/path projection.
