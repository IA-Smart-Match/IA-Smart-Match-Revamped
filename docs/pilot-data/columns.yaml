# SmartMatch pilot import column contract -- RATIFIED for the pilot.
#
# Ratified 28 Aug 2026. This file was a proposal; both questions it originally
# could not answer from evidence already in the repository are now resolved --
# P9 Gate A (board_role) and P9 Gate B (published contact fields), both closed
# 2 Sep 2026 -- see OPEN QUESTIONS below for each gate's resolution note.
# Ratified means "this is the contract the pilot import path is held to", not
# "every question about these columns was settled on day one".
#
# WIRED as of 2 Sep 2026 (P9 card W1). smartmatch_worker.column_contract
# reads this file and smartmatch_worker.handlers hands the declarations below
# to smartmatch_domain.ingest.validate_columns, so an inline-rows import is
# now held to this contract rather than to required=(), optional=(). This
# file is the single source of truth: no column name is repeated in Python.
# Enforcement is SECTION-LEVEL, per card W1's partial-ratification rule --
# a column still behind an open question would be declared under its
# dataset's `gate_pending` map and neither enforced nor treated as ratified.
# EXTENDED 5 Sep 2026 (CBA-IMPORT-CONTRACT) with customer §18's CPP CBA
# contact fields. Exactly one column is gate-pending today:
# `professionals.contact_email`, withheld behind CBA Gate C. Gate A's
# board_role and Gate B's three published contact fields were the earlier
# entries and both of those gates have since closed. See "GATE-PENDING
# COLUMNS" below.
# See docs/pilot-data/README.md for the finding this fills (F-28 / migration
# manifest: architecture v1.1 Section 1.5 is not in this repository, so the
# "real" column contract it might define has never been read). Ratifying
# this does not close F-28 -- it cannot cite a section that is not present.
#
# Column names are quoted verbatim as a coordinator's export would spell them.
# smartmatch_domain.ingest.normalize_header() compares them case- and
# punctuation-insensitively, so "Metro Region", "metro_region", and
# "  Metro-Region " are the same declared column -- but declaring the SAME
# name twice (once under required, once under optional) is a caller bug that
# validate_columns raises ValueError on, so each column below is listed once.
#
# WHAT WAS DECIDED HERE
#
#   1. The professionals name column is `name`, not `full_name`. The proposal
#      preferred `full_name` because tests/unit/test_ingest.py spells it that
#      way, but that test uses the name as an illustrative example, not as a
#      contract; `name` is the spelling on the frontend surface
#      (mockData.ts's Specialist type), which is where a coordinator's export
#      and the pilot UI actually meet. Every professionals fixture was
#      renamed to match.
#
#   2. blank_sentinels are declared PER COLUMN, not once per dataset. This
#      closes the gap the proposal could only flag: one global set meant that
#      declaring "NULL" to clean up a blank metro_region also blanked a
#      professional genuinely surnamed "Null", in every field on their row.
#      validate_columns now takes `blank_sentinels_by_column`, and a column
#      named there uses only its own set -- so a sentinel can be declared
#      where it is a placeholder and withheld where it is a value. The
#      dataset-wide `blank_sentinels` below is deliberately empty: sentinels
#      are declared positively, column by column, so that a column added
#      later inherits nothing by accident. See
#      docs/pilot-data/fixtures/professionals_null_surname_and_null_region.json
#      and the assertion it backs in verify_fixtures.py.
#
#   3. Sentinels are declared only for REQUIRED columns. Today they feed
#      exactly one check -- required_column_entirely_blank -- so a sentinel on
#      an optional column would be inert, and declaring inert things hides the
#      ones that do work. Extend the declarations when a check needs them.
#
#   4. P9 Gate A closed 2 Sep 2026
#      (docs/decisions/p9-gate-a-board-role-decision-draft.md): board_role is
#      relationship-scoped, not a flat professional attribute -- it varies by
#      (professional, unit), and multiple concurrent roles for the same
#      person across different units must be representable at once. It is
#      REMOVED from `professionals.optional` below and from `gate_pending`
#      (there is nothing left to accept-and-flag; the modelling question is
#      answered). The column now lives on the `professional_unit_relationship`
#      table (python/smartmatch_persistence/smartmatch_persistence/schema.py,
#      migration db/migrations/versions/0012_professional_unit_relationship.py)
#      with NO effective_from / effective_to columns -- the pilot is
#      current-state only per the gate record's §2. This import contract does
#      not carry board_role at all; a coordinator's export naming it now
#      reports `unexpected_columns`, the same as any other column this
#      contract does not declare.
#
#   5. `url_shaped_columns` (see events, below) names columns
#      smartmatch_worker.handlers validates with
#      smartmatch_domain.public_url.validate_static_url_shape before an
#      import writes them -- the four static HTTPS shape rules in that
#      module's docstring. A candidate that fails is never rejected outright
#      and never silently dropped: it is reported as a `url_shape_invalid`
#      WARNING finding naming the column and the failing rule, and the value
#      is still stored exactly as submitted for a coordinator's review -- the
#      same quarantine-and-review posture every other finding in this
#      contract already has. Declared per dataset, like
#      `blank_sentinels_by_column`, so a column is checked only where it is
#      declared to hold a URL.
#
#   6. Customer §18's CBA contact fields are all OPTIONAL, and `required`
#      stays exactly ("name", "metro_region"). §18's own first sentence is the
#      reason: the source data "is scattered across multiple people and
#      systems" and "there is currently no single authoritative export". A
#      contract that made Graduation Year or Contact Email mandatory would
#      refuse most real submissions for the reason the customer supplied in
#      advance, and refusing is not the fail-closed behaviour this file cares
#      about -- what fails closed here is a contract that cannot be READ (see
#      column_contract.ColumnContractError), not a coordinator whose
#      spreadsheet is incomplete. An incomplete record is exactly what the
#      quarantine-and-review path (v1.1 §1.5) exists to carry.
#
#      Whether `metro_region` should stay REQUIRED for a CBA export is a
#      separate question this card does not answer: it was ratified for the
#      IA West pilot, and §10 now measures proximity in miles from CPP using
#      city and/or ZIP. De-ratifying a required column is a decision, not a
#      refactor. Tracked as OQ-CBA-012; the safe default is to leave it.
#
#   7. `professionals.contact_email` is declared `withhold` under CBA Gate C.
#      §18 asks for it, so the column is recognized and an export carrying it
#      is neither refused nor reported as unexpected -- but no approved
#      decision covers STORING a speaker's personal address, so the value is
#      dropped before anything is written and the drop is reported. P9 Gate B
#      is not that decision: it answered the *published* event contact fields,
#      which is different data and an easier question, and it still required a
#      named privacy owner and the full ADR-0014 field set to answer. Guessing
#      the harder one because §18 mentions the column would be inventing an
#      authorization. See the gate_pending entry below for the full reasoning
#      and OQ-CBA-011 for the decision record this waits on.
#
#      Nothing in this file is a consent decision. Collecting an address is
#      not permission to use it: `smartmatch_domain.consent` admits four
#      approved consent sources (self-service, authenticated, in-person,
#      institutional relationship) and an import is none of them, so no
#      import path can reach `consented` or make anyone send-eligible. §18's
#      "Willingness to Partner with CPP (Y/N)" is likewise a stated
#      preference recorded on a contact record and NOT a ConsentSource --
#      reading it as permission to email would be exactly the inference
#      v1.1 §2.3 exists to forbid.
#
#   8. The CBA classification columns carry values, not decisions. This
#      contract declares `primary_industry_code` and `primary_role_code` and
#      says nothing about what belongs in them: it does not check a value
#      against the released NAICS sector or CBA role taxonomies, resolve a
#      display name to a code, or infer either from company or title. §19
#      puts inference and a Speaker Connector's correction downstream of the
#      import, and an unrecognized value there is a review item rather than
#      an import failure. CBA-IMPORT-CLASSIFY owns that step.
#
# GATE-PENDING COLUMNS
#
#   A column still behind an open question is declared twice: in prose
#   under open_questions (unchanged, for a human), and machine-readably under
#   its dataset's `gate_pending` map (for the worker) -- card W1 is explicit
#   that W1 "must not treat a still-open open_questions entry as ratified
#   contract". One column is declared that way below:
#   `professionals.contact_email`, `withhold`, CBA Gate C (see decision 7).
#   Gate A's board_role and Gate B's three published contact fields were the
#   earlier entries and both gates have closed (see decision 4 above and OPEN
#   QUESTIONS below). Each entry names the gate that owns the column and one
#   of two postures:
#
#     accept   -- recognized, persisted normally, and reported in a
#                 `columns_pending_gate` WARNING so a coordinator sees the
#                 meaning is unsettled. Used where the open question is about
#                 MODELLING -- P9 Gate A's board_role was this posture's first
#                 and, so far, only example.
#
#     withhold -- recognized, but the values are DROPPED before anything is
#                 written, reported in a `columns_withheld_pending_gate`
#                 WARNING naming every column withheld. Used where the open
#                 question is PRIVACY -- P9 Gate B's three contact fields were
#                 this posture's example, while Gate B stayed open: quarantine
#                 is collection, and a review_item row is persistence
#                 (ADR-0014). Accepting the import while declining to store
#                 the value is the only posture that neither invents an
#                 authorization nor discards the rest of a coordinator's
#                 submission.
#
#   Neither posture REJECTS. A gate-pending column never makes a dataset
#   unusable -- refusing would be enforcing an answer the gate has not given
#   either. When a gate closes, delete that column's gate_pending entry and
#   its open_questions paragraph together; leaving one without the other is
#   how a contract starts lying.

datasets:
  professionals:
    description: >-
      Professionals / volunteers -- the people who speak or mentor. Column
      names and the required/optional split are derived from two existing
      sources, not invented for this contract:
        1. apps/web/legacy-frontend/src/lib/mockData.ts's Specialist type
           (orphaned -- nothing imports it -- used here for shape and
           vocabulary only) supplies `name` and the optional fields company,
           title, expertise_tags, initials. mockData.ts also carried
           board_role as a flat field on Specialist; P9 Gate A decided
           (2 Sep 2026) that it is relationship-scoped instead, so it is not
           part of this dataset -- see decision 4 in WHAT WAS DECIDED HERE
           and the `professional_unit_relationship` table.
        2. tests/unit/test_ingest.py supplies metro_region as the second
           required column and "pronouns" as an optional one. That file also
           spells the name column `full_name`; ratification chose `name`
           instead, for the reason in the header.
        3. Added 5 Sep 2026: customer §18 (CPP CBA speaker / contact data
           schema) supplies the remaining optional columns -- its "Expected
           source columns" table and its "Additional fields required by
           matching" list. §18 is the first source here that is an actual
           customer statement about their own export rather than a shape
           borrowed from repository code, so where it names a field this
           file already declared under another spelling (Company Name,
           Current Position, Topic/interests/expertise text) the ratified
           spelling is kept and the field is NOT declared twice; see
           docs/pilot-data/cba-field-mapping.md.
    required:
      - name
      - metro_region
    optional:
      - company
      - title
      - expertise_tags
      # board_role removed 2 Sep 2026 -- P9 Gate A closed relationship-scoped
      # (see decision 4 in WHAT WAS DECIDED HERE, above). It is no longer a
      # professionals column at all: it lives on
      # `professional_unit_relationship`, keyed by (tenant_id,
      # professional_id, unit_id), with no effective-date columns for the
      # pilot. A coordinator's export still naming board_role here now
      # reports `unexpected_columns`, not `columns_pending_gate` -- the
      # question this posture was flagging is answered.
      - initials
      - pronouns
      # --- CBA contact fields, added 5 Sep 2026 (CBA-IMPORT-CONTRACT) ---
      #
      # Customer §18's "Expected source columns" table and its "Additional
      # fields required by matching" list, declared so a CPP CBA coordinator's
      # contact export is representable in full. Every one of them is
      # OPTIONAL, and that is the customer's own framing rather than a
      # convenience: §18 opens by saying the data "is scattered across
      # multiple people and systems" with "no single authoritative export".
      # Requiring Graduation Year would refuse most real submissions for the
      # exact reason the customer told us to expect. `name` and
      # `metro_region` stay the only required columns; see decision 6 in WHAT
      # WAS DECIDED HERE and OQ-CBA-012.
      #
      # Three §18 fields are NOT re-declared here, because this contract
      # already declares them under a spelling ratified 28 Aug 2026, and the
      # same field declared twice is the failure mode this file exists to
      # prevent (validate_columns compares after normalize_header, so
      # `company_name` would be a SECOND column beside `company`, not the
      # same one):
      #
      #   §18 "Company Name"                      -> `company` (above)
      #   §18 "Current Position"                  -> `title` (above)
      #   §18 "Topic/interests/expertise text"    -> `expertise_tags` (above)
      #
      # See docs/pilot-data/cba-field-mapping.md for the full field-to-schema
      # table and OQ-CBA-012 for the header-spelling question this defers.
      #
      # §18 source columns:
      - contact_email
      - alumni
      - graduation_year
      - major
      - willingness_to_partner_with_cpp
      - past_engagement
      # §18 "Additional fields required by matching". These five take
      # `speaker_profile`'s spellings (migration 0024, CBA-DATA-SCHEMA)
      # rather than the customer's prose, because §18 gives prose there
      # ("city and/or ZIP code") and no header text: an import column and the
      # column a reviewed record eventually lands in should not need a
      # translation table to line up. `primary_industry_code` and
      # `primary_role_code` carry the customer's own vocabulary values (the
      # 20 NAICS sector groups and 10 CBA role categories released by
      # CBA-TAXONOMY); this contract does NOT validate them against those
      # taxonomies, resolve a display name to a code, or infer either one
      # from company or title. That is CBA-IMPORT-CLASSIFY's work, and an
      # unrecognized value is a review item, not an import failure.
      - primary_industry_code
      - primary_role_code
      - location_city
      - location_postal_code
      - prior_talk
    # Empty on purpose -- this is the fallback for any column not named
    # below, and nothing should fall back into a sentinel it was never given.
    blank_sentinels: []
    blank_sentinels_by_column:
      # A coordinator's export writes these three for an empty cell.
      metro_region: &null_markers ["NULL", "nan", "N/A"]
      # Explicitly none: "Null" is a real surname (see
      # professionals_null_surname_and_null_region.json) and "None" is a real
      # place-name fragment. Stated rather than left to the empty fallback, so
      # that anyone who later adds a dataset-wide sentinel cannot silently
      # start blanking people's names.
      name: []
    # The mechanism the two closed gates left behind, used for the first time
    # since. See GATE-PENDING COLUMNS above for the two postures.
    gate_pending:
      contact_email:
        gate: CBA Gate C (speaker contact email)
        posture: withhold
        reason: >-
          Customer §18 expects a "Contact Email" on every speaker record, and
          this contract therefore RECOGNIZES the column -- an export carrying
          it is never reported as `unexpected_columns` and is never refused.
          What no approved decision covers is STORING it. P9 Gate B is not
          that decision: it closed 2 Sep 2026 over the three *published*
          contact fields on the `events` dataset -- an organizer's contact
          details already published on a public event page -- and its own
          §§B2/B3 turn on that published-ness. A speaker's personal address on
          a coordinator's spreadsheet is different data answering a different
          question, and Gate B needed a named privacy owner and the full
          ADR-0014 field set to answer the easier one. Posture `withhold`
          rather than `accept` because the open question is PRIVACY, and the
          contract's own rule for that case is that quarantine is collection
          and a review_item row is persistence (ADR-0014): the value is
          dropped before anything is written and the drop is reported in a
          `columns_withheld_pending_gate` WARNING, so a coordinator sees
          exactly what was not stored. Withholding is also the posture that
          keeps `smartmatch_domain.consent` honest while the gate is open --
          an address this system never stored cannot become a recipient by
          accident. Nothing here is a consent decision in either direction:
          collecting an email is not permission to send to it, no import path
          reaches `consented`, and `willingness_to_partner_with_cpp` (§18) is
          a stated preference on a contact record, not a `ConsentSource`.
          Tracked as OQ-CBA-011; when the gate closes, delete this entry and
          its open_questions paragraph together.

  events:
    description: >-
      Events / programs -- the sessions professionals are matched to. Column
      names are taken verbatim from mockData.ts's CppEvent type, including
      its punctuation and casing (e.g. "Event / Program", "Host / Unit").
      CppEvent marks "Event / Program" and "Category" as required (no `?`)
      and everything else optional (`?`); this contract keeps that split.
      Two CppEvent optional fields -- "Public URL" and
      "Point(s) of Contact (published)" / "Contact Email / Phone
      (published)" -- were declared here for completeness before any fixture
      exercised them; P9 Gate B closed 2 Sep 2026 collecting all three (see
      OPEN QUESTIONS for the resolution note).
    required:
      - "Event / Program"
      - "Category"
    optional:
      - "Recurrence (typical)"
      - "Host / Unit"
      - "Volunteer Roles (fit)"
      - "Primary Audience"
      - "Public URL"
      - "Point(s) of Contact (published)"
      - "Contact Email / Phone (published)"
    blank_sentinels: []
    blank_sentinels_by_column:
      # Both are institutional strings -- a program is not titled "N/A" and a
      # category is not named "NULL" -- so the markers are safe here. Note
      # that "Point(s) of Contact (published)" carries people's names and
      # would need the same withholding as professionals.name; it is
      # optional, so it takes no declaration today (see decision 3).
      "Event / Program": *null_markers
      "Category": *null_markers
    # See decision 5 in WHAT WAS DECIDED HERE, above. "Public URL" is the
    # only column any dataset declares here today; smartmatch_worker.handlers
    # runs smartmatch_domain.public_url.validate_static_url_shape against it
    # for every row that carries a value, and a shape failure becomes a
    # `url_shape_invalid` WARNING finding rather than a rejection or a
    # silent drop.
    url_shaped_columns:
      - "Public URL"

open_questions:
  - >-
    RESOLVED 2026-09-02 -- P9 Gate A closed: "board_role" is relationship-
    scoped, not intrinsic to a professional record -- it varies by
    (professional, unit), with multiple concurrent roles per person across
    different units representable at the same instant, and no
    effective_from / effective_to columns for the pilot (current-state only).
    See docs/decisions/p9-gate-a-board-role-decision-draft.md §§1-2. The
    column is removed from `professionals.optional` above and now lives on
    the `professional_unit_relationship` table
    (python/smartmatch_persistence/smartmatch_persistence/schema.py,
    migration db/migrations/versions/0012_professional_unit_relationship.py).
  - >-
    RESOLVED 2026-09-02 -- P9 Gate B closed: collect all three (Public URL;
    Point(s) of Contact (published); Contact Email / Phone (published)) per
    docs/decisions/p9-gate-b-contact-fields-worksheet.md §8. Human/import
    origin only for contact fields; crawler raw URL persistence still requires
    an approved host/path projection.
  - >-
    OPEN -- CBA Gate C (speaker contact email), tracked as OQ-CBA-011. May
    SmartMatch STORE a speaker's personal "Contact Email" (customer §18) that
    a CPP CBA coordinator supplies on a contact import, and if so under what
    retention, access, and deletion rules? P9 Gate B does not answer this: it
    decided the three *published* contact fields on the `events` dataset --
    details an organizer has already published on a public event page -- and
    §§B2/B3 of its worksheet turn on exactly that published-ness. A speaker's
    personal address on a coordinator's spreadsheet is different data. Until a
    program owner and a named privacy owner record a decision with ADR-0014's
    fields, `professionals.contact_email` stays declared under `gate_pending`
    with posture `withhold`: recognized (so an export carrying it is never
    refused and never reported as unexpected), never stored, and reported in a
    `columns_withheld_pending_gate` WARNING naming the column. Note what this
    gate is NOT about -- it is not a consent question. No answer to it can
    make an imported address send-eligible: `smartmatch_domain.consent` admits
    four approved consent sources and an import is none of them.
  - >-
    OPEN -- OQ-CBA-012, two questions this card deliberately did not settle
    about a CBA-era `professionals` export. (a) Should `metro_region` remain
    REQUIRED? It was ratified for the IA West pilot; customer §10 now measures
    proximity in miles from CPP using city and/or ZIP, and `location_city` /
    `location_postal_code` are declared optional above. A CBA export carrying
    a ZIP but no metro region currently fails `missing_required_columns`.
    (b) Should the contract adopt the customer's own header text for the three
    §18 fields already declared under an earlier spelling -- "Company Name"
    for `company`, "Current Position" for `title`, "Topic/interests/expertise
    text" for `expertise_tags`? These do not fold together under
    `normalize_header` (that function is case-, whitespace- and
    punctuation-insensitive, not a synonym table), so an export spelling them
    the customer's way today reports `unexpected_columns` -- a WARNING, and
    `_normalize_row` does not drop the values, so the data still reaches
    review. Both answers are a re-ratification, and declaring both spellings
    would be the same field twice, which is the one thing this file exists to
    prevent.
