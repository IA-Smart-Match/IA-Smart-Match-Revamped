<style>
    /* Ensure letter-spacing and typography matches design token definitions */
    .tracking-tight-title {
      letter-spacing: -0.02em;
    }
  </style>
</head>
<body class="bg-page text-ink min-h-screen flex flex-col antialiased font-body-md selection:bg-gold-tint selection:text-gold-ink">
<!-- Slim gold-wash ribbon -->
<aside class="w-full bg-gold-tint text-gold-ink py-2.5 px-4 text-center text-sm md:text-base border-none">
<div class="max-w-[1280px] mx-auto flex items-center justify-center gap-2">
<i class="w-4 h-4 text-gold-ink shrink-0 stroke-[2]" data-lucide="info"></i>
<p class="font-meta-caption text-meta-caption">
<span class="font-semibold">Fictional data —</span> All student profiles are fictional, shaped by overall survey percentages.
      </p>
</div>
</aside>
<!-- Main Canvas -->
<main class="w-full max-w-[1280px] mx-auto px-6 py-12 md:py-20 flex-1 flex flex-col justify-center items-center">
<!-- Header Section -->
<header class="text-center max-w-[720px] mb-10 md:mb-12">
<h1 class="font-headline-lg text-headline-lg text-ink font-semibold tracking-tight-title">
        Instructor
      </h1>
<p class="font-body-md text-body-md text-ink-muted mt-3">
        Load a data file, open results for an event, and see what each team has done.
      </p>
</header>
<!-- Centered Card Section -->
<section class="w-full max-w-[480px]">
<div class="bg-surface rounded-[14px] shadow-ce-elev-1 p-8">
<form class="space-y-6" onsubmit="event.preventDefault();">
<!-- Key Icon & Label -->
<div class="space-y-3">
<div class="w-12 h-12 rounded-[10px] bg-primary-tint/40 flex items-center justify-center text-primary-container">
<i class="w-8 h-8 text-primary-container stroke-[2]" data-lucide="key-round"></i>
</div>
<div>
<label class="block font-label-md text-label-md text-ink" for="passcode-input">
                Passcode
              </label>
</div>
</div>
<!-- Password Input Field -->
<div class="relative">
<input autocomplete="current-password" class="w-full h-[52px] rounded-[10px] border-2 border-line-strong bg-surface text-ink px-4 pr-12 text-lg focus:outline-none focus:border-primary-container transition-colors duration-150" id="passcode-input" name="passcode" placeholder="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-ink-muted hover:text-ink focus:outline-none p-1 transition-colors" id="toggle-password" type="button">
<i class="w-5 h-5 text-ink-muted stroke-[2]" data-lucide="eye" id="eye-icon"></i>
</button>
</div>
<!-- Primary Button & Helper Text -->
<div class="space-y-4 pt-1">
<button class="w-full h-14 rounded-[10px] bg-primary-container text-surface font-label-md text-label-md hover:opacity-95 active:scale-[0.99] transition-all duration-100 flex items-center justify-center" type="submit">
              Open the instructor page
            </button>
<!-- Helper Text Directly Under Button -->
<p class="font-meta-caption text-meta-caption text-ink-muted text-center">
              The passcode is shared by the course team. It is not your university login.
            </p>
</div>
</form>
</div>
</section>
</main>
<!-- Client Interaction Script -->
<script>
    // Initialize Lucide icons
    lucide.createIcons();

    // Toggle password visibility interaction
    const toggleButton = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('passcode-input');

    if (toggleButton && passwordInput) {
      toggleButton.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        
        // Re-render icon
        toggleButton.innerHTML = isPassword 
          ? '<i data-lucide="eye-off" class="w-5 h-5 text-ink-muted stroke-[2]"></i>'
          : '<i data-lucide="eye" class="w-5 h-5 text-ink-muted stroke-[2]"></i>';
        
        lucide.createIcons();
      });
    }
  </script>
</body></html>
