<a class="sm-skip" id="skip" href="#main">Skip to main content</a>

<div class="sm-shell" id="shell" data-portal="entry">

  <!-- The one shell header. Entry: logo and marker row. Portals: the 264px sidebar. -->
  <header class="sm-side" id="side">
    <span class="sm-logo sm-logo--entry" id="entryLogo"></span>
    <div class="sm-side__top" id="sideTop" hidden>
      <button class="b-switchbtn" id="switchBtn" type="button" aria-haspopup="listbox" aria-expanded="false"
              aria-controls="switchPop" aria-labelledby="switchLabel" aria-describedby="portalName portalWho">
        <span class="b-switchbtn__row">
          <span class="sm-logo" id="sideLogo"></span>
          <span class="b-switchbtn__name" id="portalName"></span>
        </span>
        <span class="b-switchbtn__who" id="portalWho"></span>
        <span class="b-switchbtn__act">
          <svg class="sm-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-chevrons-up-down"/></svg>
          <span id="switchLabel">Switch portal</span>
          <span class="b-kbd" aria-hidden="true"><kbd id="kbdMod">Ctrl</kbd><kbd>K</kbd></span>
        </span>
      </button>
    </div>
    <div class="b-switch" id="switchLayer" hidden>
      <div class="b-switch__pop" id="switchPop">
        <div class="b-switch__field">
          <svg class="sm-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-search"/></svg>
          <input id="switchInput" type="text" role="combobox" autocomplete="off" spellcheck="false"
                 aria-expanded="true" aria-controls="switchList" aria-autocomplete="list"
                 aria-label="Go to a portal or screen…" placeholder="Go to a portal or screen…">
        </div>
        <div class="b-switch__list" id="switchList" role="listbox" aria-label="Go to a portal or screen…"></div>
      </div>
    </div>
    <div class="sm-side__nav" id="navSlot"></div>
    <p class="sm-marker" id="marker">
      <svg class="sm-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-info"/></svg>
      <span>Design for the next phase — made-up data</span>
    </p>
  </header>

  <div class="sm-work" id="work">
    <main id="main" tabindex="-1"></main>
  </div>
</div>

<button class="sm-button sm-guide-btn" id="guideBtn" type="button" data-variant="secondary"
        aria-expanded="false" aria-controls="guide">
  <svg class="sm-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-presentation"/></svg>
  <span id="guideBtnLabel">Presenter guide</span>
</button>
<aside class="sm-guide" id="guide" aria-label="Presenter guide" data-state="closed" hidden></aside>

<div class="sm-toast" id="toast" role="status" data-state="closed"></div>

<script src="../../shared/data.js"></script>
<script src="../../shared/vendor/gsap/gsap.min.js"></script>
<script src="../../shared/vendor/gsap/Flip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
