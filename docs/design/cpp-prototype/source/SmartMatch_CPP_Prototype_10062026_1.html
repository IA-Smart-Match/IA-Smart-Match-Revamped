<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Smart Match CPP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: an entry screen with three doors (student, Career Hub, industry partner); each door opens its own portal with its own menu. Built for a projector. */
:root{
  --bg:#f2f5f2; --surface:#ffffff; --ink:#10251b; --muted:#53655a; --line:#d6dfd8;
  --green:#005030; --on-green:#ffffff; --green-soft:#e1ede6; --gold:#fdb71e; --gold-soft:#fff1cc; --gold-ink:#7a5600;
  --part:#2e5f8a; --part-bg:#e3edf7;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1611; --surface:#14211a; --ink:#e6efe9; --muted:#9db0a4; --line:#28392f;
  --green:#5fbf8c; --on-green:#07150e; --green-soft:#1b3227; --gold:#fdb71e; --gold-soft:#3a2e10; --gold-ink:#fdcf63;
  --part:#93bce4; --part-bg:#1b2a3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1611; --surface:#14211a; --ink:#e6efe9; --muted:#9db0a4; --line:#28392f;
  --green:#5fbf8c; --on-green:#07150e; --green-soft:#1b3227; --gold:#fdb71e; --gold-soft:#3a2e10; --gold-ink:#fdcf63;
  --part:#93bce4; --part-bg:#1b2a3a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:16px 48px}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
button{font:inherit}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:16px}
.logo{background:#ffffff;border-radius:10px;padding:6px 10px;display:inline-flex}
.logo img{display:block;height:44px;width:auto}
.demo{font-size:13px;color:var(--muted)}
/* entry */
.entry{display:grid;gap:28px;padding-block:24px}
.entry .logo img{height:84px}
.entry h1{font-size:clamp(34px,6vw,56px);color:var(--green)}
.entry .lede{font-size:18px;color:var(--muted);max-width:60ch}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.door{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:10px;align-content:start;transition:border-color .15s,transform .15s}
.door:hover{border-color:var(--green);transform:translateY(-2px)}
.door:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.door .who{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--gold-ink)}
.door h2{font-size:24px}
.door p{color:var(--muted);font-size:15px}
.door .go{color:var(--green);font-weight:600}
/* portal chrome */
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.bar .id{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar .pname{display:grid}
.bar .pname b{font-family:var(--display);font-size:22px}
.bar .pname span{font-size:13px;color:var(--muted)}
.shell{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}
.menu{display:grid;gap:4px;position:sticky;top:env(safe-area-inset-top,0px)}
.menu button{all:unset;cursor:pointer;padding:11px 12px;border-radius:10px;font-weight:600}
.menu button:hover{background:var(--green-soft)}
.menu button[aria-current="page"]{background:var(--green);color:var(--on-green)}
.menu button:focus-visible,.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.screen{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;min-width:0;display:grid;gap:20px;align-content:start}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start}
.head h2{font-size:28px}
.head p{margin-top:4px;color:var(--muted);max-width:64ch}
.status{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;white-space:nowrap}
.s-now{background:var(--green-soft);color:var(--green)}
.s-part{background:var(--part-bg);color:var(--part)}
.s-plan{background:var(--gold-soft);color:var(--gold-ink)}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.small{font-size:13px;color:var(--muted)}
.btn{all:unset;cursor:pointer;background:var(--green);color:var(--on-green);padding:10px 16px;border-radius:9px;font-weight:600;font-size:15px;text-align:center}
.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--green)}
.btn.done{background:var(--gold);color:#1d1503}
.btn[disabled]{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.block{display:grid;gap:10px;min-width:0;align-content:start}
.callout{background:var(--gold-soft);border-radius:10px;padding:10px 14px;font-size:14px}
/* interview */
.iv{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
.chat{border:1px solid var(--line);border-radius:14px;display:grid;grid-template-rows:1fr auto;min-height:440px;max-height:560px;min-width:0}
.log{overflow-y:auto;padding:16px;display:grid;gap:10px;align-content:start}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;font-size:15px}
.msg.ai{background:var(--green-soft);border-bottom-left-radius:4px}
.msg.me{background:var(--green);color:var(--on-green);justify-self:end;border-bottom-right-radius:4px}
.msg .who{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;opacity:.7;margin-bottom:2px}
.reply{border-top:1px solid var(--line);padding:12px;display:grid;gap:10px}
.reply form{display:flex;gap:8px}
.reply input{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font:inherit;background:var(--bg);color:var(--ink)}
.card{border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;align-content:start;background:var(--bg)}
.person{display:flex;gap:12px;align-items:center}
.avatar{width:50px;height:50px;border-radius:50%;background:var(--gold);color:#1d1503;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;flex:none}
.person h3{font-size:20px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:2px 9px;margin:2px 4px 2px 0;background:var(--green-soft);color:var(--green);font-weight:600}
.pill.new{background:var(--gold-soft);color:var(--gold-ink)}
.empty{color:var(--muted);font-style:italic}
/* events */
.events{display:grid;gap:12px}
.ev{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:16px}
.date{width:60px;text-align:center;border-radius:10px;background:var(--green-soft);padding:6px 0;font-family:var(--display)}
.date b{display:block;font-size:22px;line-height:1}
.date span{font-size:12px;text-transform:uppercase;color:var(--muted);font-family:var(--body)}
.ev h3{font-size:18px}
.ev .meta{font-size:13px;color:var(--muted)}
.why{margin-top:6px;font-size:14px;background:var(--gold-soft);border-radius:8px;padding:6px 10px;display:inline-block}
.why b{color:var(--gold-ink)}
.ev-actions{display:grid;gap:6px;justify-items:end}
.mono{font-family:var(--mono);font-size:12px;color:var(--muted)}
.qr{display:flex;gap:16px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:16px;flex-wrap:wrap}
.qr svg{width:116px;height:116px;flex:none}
.points{font-family:var(--display);font-size:40px;font-weight:700;color:var(--green);line-height:1}
/* growth */
.timeline{display:grid;border-left:3px solid var(--line);margin-left:8px}
.term{position:relative;padding:0 0 22px 22px}
.term::before{content:"";position:absolute;left:-9px;top:4px;width:15px;height:15px;border-radius:50%;background:var(--green);border:3px solid var(--surface)}
.term.future::before{background:var(--surface);border-color:var(--gold)}
.term h3{font-size:16px;font-family:var(--body);font-weight:600}
.term ul{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.term li{font-size:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.tag{font-size:11px;border-radius:5px;padding:1px 6px;background:var(--green-soft);color:var(--green);font-weight:600}
.tag.p{background:var(--gold-soft);color:var(--gold-ink)}
/* bars, kpis */
.bars{display:grid;gap:8px}
.barrow{display:grid;grid-template-columns:170px 1fr 40px;gap:10px;align-items:center;font-size:14px}
.barrow .t{height:12px;border-radius:6px;background:var(--green-soft);overflow:hidden}
.barrow .f{height:100%;background:var(--green);border-radius:6px}
.barrow .f.g{background:var(--gold)}
.barrow .n{font-family:var(--mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi b{display:block;font-family:var(--display);font-size:30px;color:var(--green);font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--bg);position:sticky;top:0}
tr.hl td{background:var(--gold-soft)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:end}
.controls label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.controls select,.controls input[type=search]{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;background:var(--bg);color:var(--ink);min-width:0}
.weights{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.weights label{display:grid;gap:4px;font-size:14px}
.weights input{accent-color:var(--green);width:100%}
.funnel{display:grid;gap:6px}
.fstep{display:flex;align-items:center;gap:10px;font-size:14px}
.fstep .fb{height:30px;background:var(--green);border-radius:6px;color:var(--on-green);display:flex;align-items:center;padding:0 10px;font-family:var(--mono);font-size:13px;min-width:44px}
.quote{border-left:3px solid var(--gold);padding:4px 12px;font-size:14px}
.privacy{border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:8px;background:var(--bg)}
.privacy ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
 .ring{display:grid;place-items:center;position:relative;width:150px;height:150px;flex:none}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring b{font-family:var(--display);font-size:38px;color:var(--green);line-height:1}
.ring span{font-size:12px;color:var(--muted)}
.rtop{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.markers{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.mk{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;align-content:start}
.mk-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mk-h h3{font-size:17px}
.dots{display:flex;gap:4px}
.dots i{width:22px;height:8px;border-radius:4px;background:var(--line)}
.dots i.on{background:var(--green)}
.dots i.on.g{background:var(--gold)}
.step{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;font-size:14px}
.step input{accent-color:var(--green);width:18px;height:18px;margin:1px 0 0}
.step .ico{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700}
.step .ico.on{background:var(--green);border-color:var(--green);color:var(--on-green)}
.step .lv{font-size:11px;color:var(--muted);white-space:nowrap}
.help{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;border:1px solid var(--green);border-radius:12px;padding:14px 16px;background:var(--green-soft)}
.help .hi{width:44px;height:44px;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center;font-family:var(--display);font-weight:700}
.help h3{font-size:17px}
.help .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.mk-help{display:flex;flex-wrap:wrap;gap:6px 14px;border-top:1px dashed var(--line);padding-top:8px;font-size:13px}
.linkbtn{all:unset;cursor:pointer;color:var(--green);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.linkbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.advisor{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;background:var(--bg)}
.advisor .slots{display:flex;flex-wrap:wrap;gap:8px}
.guideBtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6}
.guide{position:fixed;right:16px;bottom:calc(70px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 32px));max-height:70vh;overflow-y:auto;background:var(--surface);border:2px solid var(--gold);border-radius:14px;padding:16px;z-index:6;display:grid;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.guide h3{font-size:18px}
.guide ol{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px}
.guide .say{background:var(--gold-soft);border-radius:8px;padding:8px 10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
.toast.show{opacity:1}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .menu{position:static;grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;padding-bottom:4px}
  .iv{grid-template-columns:1fr}
  .screen{padding:16px}
  .ev{grid-template-columns:auto 1fr}
  .ev-actions{grid-column:1/-1;justify-items:stretch}
  .barrow{grid-template-columns:110px 1fr 34px}
  .logo img{height:34px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status"></div>

/* ---------- matching (same four factors as the class version) ---------- */
function score(st,ev,w=S.w){
  const fMajor=ev.major===st.major?1:0;
  const hit=st.interests.filter(t=>ev.topics.includes(t));
  const fInt=hit.length?1:0;
  const gt=GOALTOPIC[st.goal]||[];
  const fGoal=gt.some(t=>ev.topics.includes(t))?1:0;
  const related=st.events.filter(e=>PAST[e]&&PAST[e][2].some(t=>ev.topics.includes(t)));
  const fPast=related.length>=2?1:related.length===1?.5:0;
  const total=w.major*fMajor+w.interest*fInt+w.goal*fGoal+w.past*fPast;
  const r=[];
  if(fInt)r.push(`said they're interested in ${short(hit[0]).toLowerCase()}`);
  if(fGoal)r.push(`career goal fits`);
  if(fPast)r.push(`went to ${related.length} similar event${related.length>1?"s":""}`);
  if(fMajor)r.push(`same major`);
  const info=st.interests.length||st.goal?"Profile card":st.events.length?"Major + events":"Major only";
  let reason=r.join("; ");
  if(!r.length)reason="No match on file";
  else if(info==="Major only")reason+="; nothing else on file";
  return {total,reason,info,fInt,fGoal,fPast,fMajor,hit,related};
}

function drawQR(e){

  let s=`<rect width="29" height="29" fill="#ffffff"/>`;
  const fd=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#10251b"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#ffffff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#10251b"/>`;
  for(let y=1;y<28;y++)for(let x=1;x<28;x++){const inF=(x<9&&y<9)||(x>19&&y<9)||(x<9&&y>19);if(!inF&&rnd()>.55)s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#10251b"/>`}
  $("#qrSvg").innerHTML=s+fd(1,1)+fd(21,1)+fd(1,21);
}

  const ranked=STUDENTS.map(s=>({s,...score(s,ev)})).filter(r=>r.total>0).sort((a,b)=>b.total-a.total||infoRank(b.info)-infoRank(a.info)||yr(b.s.year)-yr(a.s.year)||a.s.tb-b.s.tb).slice(0,30);
  const gPos=ranked.findIndex(r=>r.s.id==="P046");
  const sl=(k,l)=>`<label for="w-${k}">${l} <b class="mono" style="color:var(--ink)">${S.w[k]}</b><input type="range" id="w-${k}" min="0" max="10" value="${S.w[k]}" data-w="${k}"></label>`;
  $("#main").innerHTML=`<section class="screen">
   <div class="head"><div><h2>Match students to an event</h2><p>Pick an event and the app ranks all ${STUDENTS.length} students. Staff can adjust how much each factor counts, then invite the top 30 personally.</p></div>${status("s-now","Working in class version")}</div>
   <div class="controls"><label for="evSel">Event<select id="evSel">${UPCOMING.map(e=>`<option value="${e.id}" ${e.id===S.hubEvent?"selected":""}>${e.title} · ${e.when}</option>`).join("")}</select></label></div>
   <div class="weights">${sl("major","Same major")}${sl("interest","Said they're interested")}${sl("goal","Career goal fits")}${sl("past","Went to similar events")}</div>
   <p class="small">${gPos>=0?`Grace Delgado is #${gPos+1} on this list${GRACE.viaAI?" because of her interview answers":""}.`:GRACE.viaAI?"Grace Delgado is not in the top 30 for this event.":"Grace has not done her interview yet, so the app knows little about her."}</p>
   <div class="tablewrap"><table><thead><tr><th>#</th><th>Student</th><th>Major</th><th>Why on the list</th><th>What we know</th></tr></thead><tbody>
   ${ranked.slice(0,15).map((r,i)=>`<tr class="${r.s.id==="P046"?"hl":""}"><td class="num">${i+1}</td><td>${esc(r.s.name)}</td><td>${r.s.major}</td><td>${r.reason}</td><td class="small">${r.s.viaAI?"Profile card (AI interview)":r.info}</td></tr>`).join("")}
   </tbody></table></div>
   <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><span class="small">Showing 15 of the top 30.</span><button class="btn" id="invite">Send personal invitations to top 30</button></div>
  </section>`;
  $("#evSel").onchange=e=>{S.hubEvent=e.target.value;pMatch()};
  document.querySelectorAll("[data-w]").forEach(i=>i.oninput=()=>{S.w[i.dataset.w]=+i.value;const id=i.id;pMatch();const n=document.getElementById(id);n&&n.focus()});
  $("#invite").onclick=()=>toast("In the full version, each student gets a personal invitation and a reminder.");
}
const infoRank=i=>i==="Profile card"?2:i==="Major + events"?1:0;
const yr=y=>({Freshman:1,Sophomore:2,Junior:3,Senior:4})[y]||0;

/* ---------- partner ---------- */
function pTalk(){
  $("#main").innerHTML=`<section class="screen">
   <div class="head"><div><h2>Your talk: Northline Analytics</h2><p>Behind the Business series · Thu Mar 4, 2027 · what an industry partner sees after speaking. Numbers are illustrative.</p></div>${status("s-part","Partly built")}</div>
   <div class="grid2">
    <div class="block"><div class="label">Who was invited</div>
     <p class="small" style="color:var(--ink)">Students who said they're interested in technology or data, from every major, not only Computer Information Systems.</p>
     ${bars([["Accounting",8],["Computer Info Systems",7],["Finance, RE & Law",6],["IB & Marketing",5],["Management & HR",4]],8)}</div>
    <div class="block"><div class="label">How your talk filled</div>
     <div class="funnel">${[["Invited personally",30],["Signed up",19],["Attended",14]].map(([k,v])=>`<div class="fstep"><div class="fb" style="width:${Math.max(16,v/30*70)}%">${v}</div><span>${k}</span></div>`).join("")}</div>
     <p class="small">A mass email to all students for a similar talk brought about 6 people.</p></div>
   </div>
   <div class="grid2">
    <div class="block"><div class="label">What students asked you</div>
     <div class="quote">"What should an accounting student learn first to move into data work?"</div>
     <div class="quote">"Does Northline hire interns from outside computer science?"</div>
     <p class="small">Average rating 4.6 of 5 from 14 students.</p></div>
    <div class="block"><div class="label">Stay involved</div>
     <div style="display:flex;flex-wrap:wrap;gap:10px">
      <button class="btn" data-toast="Offer sent to the Career Hub">Offer another talk</button>
      <button class="btn ghost" data-toast="Students who asked to connect will be notified">Meet interested students</button>
      <button class="btn ghost" data-toast="Internship post sent to the Career Hub for review">Post an internship</button></div>
     <p class="small">You see totals and questions, never individual student records. Your contact stays with the college, not with one staff member.</p></div>
   </div></section>`;
  document.querySelectorAll("[data-toast]").forEach(b=>b.onclick=()=>toast(b.dataset.toast));
}

/* ---------- presenter guide ---------- */
const GUIDE={
 entry:["Opening (Chau)","Start here. One sentence on the problem, then pick a door.",["Problem: events struggle to fill seats, contacts sit with individual staff, and nobody can see a student's growth.","Explain the three doors: one app, three kinds of users, each with its own sign-in.","Click Student portal."],"\"Smart Match brings the right events to the right students, and keeps a record of how each student grows.\""],
 interview:["Student · AI interview (Chau)","Show that the app already knows the student's record, and the interview fills in the rest.",["Point to the right side: major, year and events come from college records.","Answer the chat: curious about tech jobs → Done → Not sure yet → Yes, help me compare.","Watch the profile card fill in as she answers.","Say clearly: this interview is scripted for today; a live AI version is planned."],"\"Most students never fill in a form. A two-minute conversation does it for them.\""],
 recs:["Student · Events for me (Chau)","Show events coming to the student, each with a reason.",["Read one 'Why you' line out loud.","Mention: before the interview, the app only suggested the audit event because she's an accounting major.","Click Register on the top event to show the check-in code and points."],"\"Every suggestion says why. Staff and students can see it isn't a black box.\""],
 readiness:["Student · My readiness (Janice)","Points show effort; readiness shows progress toward being job-ready.",["Point to the ring: readiness now versus the gold mark for a junior.","Tick one self-check (for example, LinkedIn) and show the % move a little.","Explain why: confirmed steps count double, so self-checks alone can't raise it much.","Say the markers are a draft and will follow the college's official list.","Show the four help options: assistant bot (AI) for quick questions, message an advisor, book an advisor, digital resources. Ask the bot How do I get my resume reviewed? and it hands off to a real advisor."],"\"Grace can see where she stands for her year and exactly what to do next.\""],
 growth:["Student · My growth (Janice)","The record that stays after graduation.",["Walk the timeline from sophomore year to after graduation.","Point out that her events lean toward media and technology, which her major alone would never show."],"\"Over four years this becomes the college's best evidence of what helps students.\""],
 overview:["Career Hub · Term overview (Janice)","What the college can report each term.",["These numbers come from the 300 made-up student records in the class file.","Point to 'students never reached by an event' as the opportunity.","Readiness charts are illustrative."],"\"For the first time, the Career Hub can see who it isn't reaching.\""],
 records:["Career Hub · Student records (Janice)","Every student is on file from day one.",["Type 'Delgado' in search to find Grace; her card shows 'AI interview · today'."],"\"Students don't sign up from scratch; they activate a record that already exists.\""],
 match:["Career Hub · Match students to an event (Chau)","How staff fill an event.",["Northline is selected: Grace is #4 because of her interview answers.","Move the 'Same major' slider up and show CIS majors take over the list.","Close: invite the top 30 personally."],"\"Students from any major who said they care about the topic get invited, not only the obvious major.\""],
 talk:["Partner · My talk (Chau)","Why industry partners would come back.",["Show who was invited, from five majors.","Show the turnout compared with a mass email.","Ask the board: 'Would you use this? What would make you speak again?'"],"\"Your contact stays with the college, and you see the difference your talk made.\""]
};
S.guide=false;
function renderGuide(){
  let b=document.getElementById("guideBtn");
  if(!b){b=document.createElement("button");b.id="guideBtn";b.className="btn guideBtn";document.body.append(b);b.onclick=()=>{S.guide=!S.guide;renderGuide()}}
  b.textContent=S.guide?"Hide presenter guide":"Presenter guide";
  let g=document.getElementById("guide");if(g)g.remove();
  if(!S.guide)return;
  const key=S.portal?S.page[S.portal]:"entry",d=GUIDE[key];if(!d)return;
  g=document.createElement("aside");g.id="guide";g.className="guide";g.setAttribute("aria-label","Presenter guide");
  g.innerHTML=`<div class="label">Presenter guide</div><h3>${d[0]}</h3><p class="small">${d[1]}</p><ol>${d[2].map(x=>`<li>${x}</li>`).join("")}</ol><div class="say"><b>Say:</b> ${d[3]}</div>`;
  document.body.append(g);
}

try{const v=JSON.parse(localStorage.getItem("smp")||"null");if(v&&PORTALS[v[0]]){S.portal=v[0];S.page[v[0]]=v[1]}}catch(e){}
render();
</script>
