<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1320 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ci-release-title ci-release-desc" style="min-width:1320px;max-width:1320px" id="ci-release-root"><title id="ci-release-title">CI and release pipeline</title><desc id="ci-release-desc">Pipeline from a feature branch through a reviewed pull request and main, then a manual promote workflow that fast-forwards the deploy branch and dispatches the deploy workflow, which reaches the pilot VM over IAP and runs deploy.sh, optionally bringing up the exercise overlay.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ci-release-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
  --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
      #ci-release-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ci-release-root .diagram-container { width:100%; overflow-x:auto; margin-bottom:2rem; }
      #ci-release-root .meta { font-family:var(--font-mono); font-size:0.7rem; color:var(--color-muted); margin-bottom:1.5rem; }
      #ci-release-root .notes { font-size:0.85rem; line-height:1.5; color:var(--color-ink); }
      #ci-release-root .notes table { border-collapse:collapse; width:100%; margin:0.5rem 0 1rem; font-size:0.8rem; }
      #ci-release-root .notes th, #ci-release-root .notes td { border-bottom:1px solid rgba(45,49,66,0.12); padding:4px 8px; text-align:left; vertical-align:top; }
      #ci-release-root .notes th { font-family:var(--font-mono); font-size:0.68rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--color-muted); }
      #ci-release-root .notes code { font-family:var(--font-mono); font-size:0.78em; }
      #ci-release-root .notes ul { padding-left:1.2rem; }
      #ci-release-root .diagram-container { overflow-x:visible; }</style><marker id="ci-release-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="ci-release-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="ci-release-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><path d="M 170,128 L 240,128" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ci-release-arrow)"/>
