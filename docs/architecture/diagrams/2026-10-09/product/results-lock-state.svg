<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1100 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="results-lock-state-title results-lock-state-desc" style="min-width:1100px;max-width:1100px" id="results-lock-state-root"><title id="results-lock-state-title">Class exercise results lock</title><desc id="results-lock-state-desc">State machine for one event&#x27;s results lock: never opened, open, and closed again, driven by the instructor&#x27;s unlock and lock routes, with what a team&#x27;s results run gets in each state.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #results-lock-state-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
  --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
      #results-lock-state-root { font-family: var(--font-sans); color: var(--color-ink); }
      #results-lock-state-root .diagram-container { width:100%; overflow-x:auto; margin-bottom:2rem; }
      #results-lock-state-root .meta { font-family:var(--font-mono); font-size:0.7rem; color:var(--color-muted); margin-bottom:1.5rem; }
      #results-lock-state-root .notes { font-size:0.85rem; line-height:1.5; color:var(--color-ink); }
      #results-lock-state-root .notes table { border-collapse:collapse; width:100%; margin:0.5rem 0 1rem; font-size:0.8rem; }
      #results-lock-state-root .notes th, #results-lock-state-root .notes td { border-bottom:1px solid rgba(45,49,66,0.12); padding:4px 8px; text-align:left; vertical-align:top; }
      #results-lock-state-root .notes th { font-family:var(--font-mono); font-size:0.68rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--color-muted); }
      #results-lock-state-root .notes code { font-family:var(--font-mono); font-size:0.78em; }
      #results-lock-state-root .notes ul { padding-left:1.2rem; }
      #results-lock-state-root .diagram-container { overflow-x:visible; }</style><marker id="results-lock-state-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="results-lock-state-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="results-lock-state-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><path d="M 56,200 L 100,200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#results-lock-state-arrow)"/>
<path d="M 340,188 L 440,188" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#results-lock-state-arrow)"/>
<path d="M 680,188 L 820,188" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#results-lock-state-arrow-accent)"/>
<path d="M 820,216 L 680,216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#results-lock-state-arrow)"/>
<path d="M 530,160 L 530,132 Q 530,124 538,124 L 592,124 Q 600,124 600,132 L 600,160" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#results-lock-state-arrow)"/>
<rect x="370.0" y="170" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="390" y="179" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UNLOCK</text>
<rect x="735.5" y="170" width="29" height="12" rx="2" fill="#f5f5f5"/><text x="750" y="179" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOCK</text>
<rect x="713.5" y="222" width="73" height="12" rx="2" fill="#f5f5f5"/><text x="750" y="231" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UNLOCK AGAIN</text>
<rect x="523.0" y="102" width="84" height="12" rx="2" fill="#f5f5f5"/><text x="565" y="111" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UNLOCK = NO-OP</text>
<rect x="100" y="160" width="240" height="80" rx="6" fill="#f5f5f5"/><rect x="100" y="160" width="240" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="220.0" y="192.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Never opened</text><text x="220.0" y="206.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no exercise_result_unlock row</text><text x="220.0" y="218.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lock here = no-op</text>
<rect x="440" y="160" width="240" height="80" rx="6" fill="#f5f5f5"/><rect x="440" y="160" width="240" height="80" rx="6" fill="#eb6c36" fill-opacity="0.10" stroke="#eb6c36" stroke-width="1"/><text x="560.0" y="192.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Open</text><text x="560.0" y="206.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">row, closed_at IS NULL</text><text x="560.0" y="218.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">teams may run once</text>
<rect x="820" y="160" width="240" height="80" rx="6" fill="#f5f5f5"/><rect x="820" y="160" width="240" height="80" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/><text x="940.0" y="192.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Closed again</text><text x="940.0" y="206.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">row, closed_at set</text><text x="940.0" y="218.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lock again = no-op</text>
<circle cx="50" cy="200" r="6" fill="#2d3142"/>
<text x="220" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">team run → 409</text>
<text x="220" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">exercise_results_locked</text>
<text x="560" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">team run → stored once;</text>
<text x="560" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">a second run → 409 already_run</text>
<text x="940" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">team run → 409 locked;</text>
<text x="940" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stored runs stay visible</text>
<text x="60" y="340" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">* Either route on an event that is not round one or two → 409 exercise_event_is_not_a_round; unknown event → 404.</text>
<text x="60" y="354" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">  Reopening moves unlocked_at to now (D16 amendment, 2026-10-06). Closing deletes no run.</text>
<line x1="30" y1="396" x2="1070" y2="396" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
<text x="30" y="416" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
<rect x="100" y="407" width="22" height="12" rx="3" fill="#ffffff" stroke="#2d3142"/>
<text x="130" y="416" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">state</text>
<rect x="180" y="407" width="22" height="12" rx="3" fill="#eb6c36" fill-opacity="0.10" stroke="#eb6c36"/>
<text x="210" y="416" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">runs allowed</text>
<rect x="295" y="407" width="22" height="12" rx="3" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75"/>
<text x="325" y="416" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">closed, runs kept</text>
<line x1="435" y1="413" x2="457" y2="413" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="465" y="416" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">idempotent</text></svg>
