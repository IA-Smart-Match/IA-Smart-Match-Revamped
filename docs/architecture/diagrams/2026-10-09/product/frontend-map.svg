<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="frontend-map-title frontend-map-desc" style="min-width:900px;max-width:900px" id="frontend-map-root"><title id="frontend-map-title">Frontend routes, shells and API clients</title><desc id="frontend-map-desc">Route shells of apps/web/legacy-frontend, with the exercise pages calling the cookie-based exercise client and every other shell, including the gated speaker portal and eleven dormant pages, calling the bearer-token api.ts client.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #frontend-map-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
  --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
      #frontend-map-root { font-family: var(--font-sans); color: var(--color-ink); }
      #frontend-map-root .diagram-container { width:100%; overflow-x:auto; margin-bottom:2rem; }
      #frontend-map-root .meta { font-family:var(--font-mono); font-size:0.7rem; color:var(--color-muted); margin-bottom:1.5rem; }
      #frontend-map-root .notes { font-size:0.85rem; line-height:1.5; color:var(--color-ink); }
      #frontend-map-root .notes table { border-collapse:collapse; width:100%; margin:0.5rem 0 1rem; font-size:0.8rem; }
      #frontend-map-root .notes th, #frontend-map-root .notes td { border-bottom:1px solid rgba(45,49,66,0.12); padding:4px 8px; text-align:left; vertical-align:top; }
      #frontend-map-root .notes th { font-family:var(--font-mono); font-size:0.68rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--color-muted); }
      #frontend-map-root .notes code { font-family:var(--font-mono); font-size:0.78em; }
      #frontend-map-root .notes ul { padding-left:1.2rem; }
      #frontend-map-root .diagram-container { overflow-x:visible; }</style><marker id="frontend-map-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="frontend-map-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="frontend-map-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><path d="M 290,158 L 560,158" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#frontend-map-arrow)"/>
