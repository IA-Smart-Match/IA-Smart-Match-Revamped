<rect x="840" y="210" width="200" height="60" rx="6" fill="#f5f5f5"/><rect x="840" y="210" width="200" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="940.0" y="232.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Choose asking, refresh</text><text x="940.0" y="246.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST …/asking-choice</text><text x="940.0" y="258.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST …/refresh · once</text>
<rect x="1080" y="210" width="200" height="60" rx="6" fill="#f5f5f5"/><rect x="1080" y="210" width="200" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="1180.0" y="238.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Run round two</text><text x="1180.0" y="252.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Harbor · once per team</text>
