<rect x="840" y="80" width="200" height="60" rx="6" fill="#f5f5f5"/><rect x="840" y="80" width="200" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="940.0" y="108.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Refresh every team</text><text x="940.0" y="122.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST …/instructor/refresh-all</text>
<rect x="1080" y="80" width="200" height="60" rx="6" fill="#f5f5f5"/><rect x="1080" y="80" width="200" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="1088" y="86" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/><text x="1108.0" y="95" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROUND 2</text><text x="1180.0" y="114.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Unlock Harbor</text><text x="1180.0" y="128.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">same unlock route</text>
<rect x="120" y="210" width="200" height="60" rx="6" fill="#f5f5f5"/><rect x="120" y="210" width="200" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="220.0" y="232.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Enter team number</text><text x="220.0" y="246.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST /v1/exercise/workspaces</text><text x="220.0" y="258.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sets team cookie</text>
<rect x="360" y="210" width="200" height="60" rx="6" fill="#f5f5f5"/><rect x="360" y="210" width="200" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="460.0" y="232.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Match and save settings</text><text x="460.0" y="246.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">weights default 3/3/2/2</text><text x="460.0" y="258.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">scale 0–10 · PUT …/settings</text>
