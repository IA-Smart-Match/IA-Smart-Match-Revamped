<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1320 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="class-exercise-swimlane-title class-exercise-swimlane-desc" style="min-width:1320px;max-width:1320px" id="class-exercise-swimlane-root"><title id="class-exercise-swimlane-title">Class exercise: team, instructor and system</title><desc id="class-exercise-swimlane-desc">Swimlane of one class-exercise session: a team enters, matches with default weights 3/3/2/2 and saves settings, runs round one once the instructor unlocks Northline, chooses a way of asking and refreshes, then runs round two once Harbor is unlocked, with every run checked by the server&#x27;s run guard.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #class-exercise-swimlane-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
  --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
      #class-exercise-swimlane-root { font-family: var(--font-sans); color: var(--color-ink); }
      #class-exercise-swimlane-root .diagram-container { width:100%; overflow-x:auto; margin-bottom:2rem; }
      #class-exercise-swimlane-root .meta { font-family:var(--font-mono); font-size:0.7rem; color:var(--color-muted); margin-bottom:1.5rem; }
      #class-exercise-swimlane-root .notes { font-size:0.85rem; line-height:1.5; color:var(--color-ink); }
      #class-exercise-swimlane-root .notes table { border-collapse:collapse; width:100%; margin:0.5rem 0 1rem; font-size:0.8rem; }
      #class-exercise-swimlane-root .notes th, #class-exercise-swimlane-root .notes td { border-bottom:1px solid rgba(45,49,66,0.12); padding:4px 8px; text-align:left; vertical-align:top; }
      #class-exercise-swimlane-root .notes th { font-family:var(--font-mono); font-size:0.68rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--color-muted); }
      #class-exercise-swimlane-root .notes code { font-family:var(--font-mono); font-size:0.78em; }
      #class-exercise-swimlane-root .notes ul { padding-left:1.2rem; }
      #class-exercise-swimlane-root .diagram-container { overflow-x:visible; }</style><marker id="class-exercise-swimlane-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="class-exercise-swimlane-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="class-exercise-swimlane-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><line x1="40" y1="40" x2="1280" y2="40" stroke="#2d3142" stroke-opacity="0.15" stroke-width="1"/><text x="48" y="58" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">INSTRUCTOR</text>
<line x1="40" y1="160" x2="1280" y2="160" stroke="#2d3142" stroke-opacity="0.15" stroke-width="1"/><text x="48" y="178" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TEAM</text>
<line x1="40" y1="300" x2="1280" y2="300" stroke="#2d3142" stroke-opacity="0.15" stroke-width="1"/><text x="48" y="318" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SYSTEM</text>
<line x1="40" y1="430" x2="1280" y2="430" stroke="#2d3142" stroke-opacity="0.15" stroke-width="1"/>
