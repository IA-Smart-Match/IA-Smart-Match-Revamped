<text x="40" y="600" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">Every table except tenant and pilot_login_attempt carries tenant_id; child FKs are composite (tenant_id, x) → parent, so tenant isolation is a schema property.</text>
<text x="40" y="614" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">Arrows show one representative FK per cluster pair (child → parent), not every FK. Full per-table list: README.md in this folder.</text>
<text x="40" y="628" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">54 tables in schema.py + 8 exercise_* tables (separate diagram) = 62, all created by migrations 0001–0046, one head.</text>
