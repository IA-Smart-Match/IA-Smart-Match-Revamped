        <title id="er-cba-platform-title">CBA platform data model (clusters)</title>
        <desc id="er-cba-platform-desc">Cluster-level data model of the 54 CBA platform tables: identity and tenancy at the root, the job/outbox substrate referenced by matching, outreach and import, and events, speakers, invitations and attendance around them.</desc>
