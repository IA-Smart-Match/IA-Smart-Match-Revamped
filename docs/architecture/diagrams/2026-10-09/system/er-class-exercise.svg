        <title id="er-class-exercise-title">Class exercise data model</title>
        <desc id="er-class-exercise-desc">Entity-relationship model of the eight class-exercise tables: a dataset owns profiles, events and team workspaces; workspaces own profile overlays, saved settings and one result run per event; events carry an optional result unlock.</desc>
