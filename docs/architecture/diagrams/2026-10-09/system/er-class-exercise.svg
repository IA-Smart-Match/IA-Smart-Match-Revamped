      #er-class-exercise-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #er-class-exercise-root { font-family: var(--font-sans); color: var(--color-ink); }
      #er-class-exercise-root .diagram-container { width: 100%; overflow-x: auto; }
      #er-class-exercise-root .caption { font-family: var(--font-mono); font-size: 0.72rem; color: var(--color-muted); margin-top: 1rem; line-height: 1.5; max-width: 90ch; }
      #er-class-exercise-root .diagram-container { overflow-x: visible; }</style>
